# ──────────────────────────────────────────────────────────────────
# 운영(production) 프로파일 오버라이드
#
# 활성화 방법: 실행 환경에 아래 중 하나를 설정
#   - 환경변수:  SPRING_PROFILES_ACTIVE=prod
#   - 실행 인자:  java -jar app.jar --spring.profiles.active=prod
#
# 이 파일은 기본 application.yml '위에 덮어쓰기'로 적용된다.
# DB·OAuth·SMS·결제 키 등 민감정보는 절대 여기에 두지 말 것.
#   (그 값들은 git 추적에서 제외된 application.yml / 환경변수에 유지)
# 따라서 이 파일에는 공개 저장소에 커밋해도 안전한 운영 설정만 담는다.
# ──────────────────────────────────────────────────────────────────
site:
  url: ${SITE_URL:https://lightdrone.co.kr}

spring:
  web:
    locale: ko_KR
    locale-resolver: fixed
    resources:
      cache:
        cachecontrol:
          max-age: 1d
          cache-public: true

  jpa:
    # 운영에서는 SQL 콘솔 출력 비활성화 (로그 과다·데이터 노출 방지)
    show-sql: false
    hibernate:
      # 2단계: Flyway baseline(운영 적용 완료) 후 validate 로 전환.
      #  - 운영 스키마는 이제 Flyway 마이그레이션으로만 변경한다(자동 보정 금지).
      #  - 부팅 시 매핑↔스키마 일치만 검증하므로, 불일치가 있으면 부팅이 실패(=조기 발견)한다.
      #  - 로컬 lightdrone-pg(동일 스키마)에서 validate 부팅·전체 테스트 통과 확인함.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  # ── Flyway DB 마이그레이션 (운영, 1단계: baseline 도입) ───────────────
  #  중요: flyway-core 가 클래스패스에 있으면 Flyway 는 기본적으로 켜진다.
  #  운영 DB 는 이미 스키마가 있으므로(비어있지 않음) baseline-on-migrate 가 없으면
  #  "non-empty schema without schema history table" 오류로 부팅이 실패한다.
  #  따라서 이 설정(특히 baseline-on-migrate=true)은 git 추적되는 이 파일에 반드시 둔다.
  #  application.yml 은 .gitignore 대상이라 운영에 배포되지 않기 때문.
  #
  #  동작:
  #   - 운영(기존 DB): version=1 baseline 만 기록하고 V1__baseline_schema.sql 은 실행하지 않음 → 기존 스키마/데이터 보존.
  #   - 신규/빈 DB:     V1__baseline_schema.sql 로 전체 스키마 생성.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "baseline existing schema (pre-flyway)"
    clean-disabled: true       # 운영 DB 보호: schema clean(전체 삭제) 영구 차단
    validate-on-migrate: true
    out-of-order: false

  thymeleaf:
    # 운영에서는 템플릿 캐시 활성화 (요청마다 재파싱하지 않아 성능 향상)
    cache: true

server:
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
  servlet:
    session:
      # 일정 시간 무활동 시 자동 로그아웃(세션 만료).
      #  - 30분: 국내 일반 쇼핑몰 평균 수준이며 Spring 기본값과도 동일.
      #  - 기본값과 같아 성능 영향은 없고, '정책을 명시'해 두는 의미로 고정한다.
      #  - 사용자가 활동(요청)하면 타이머는 자동으로 갱신된다.
      timeout: 30m
      cookie:
        # 운영(HTTPS)에서 세션 쿠키 보안 강화
        #  - http-only: JS(document.cookie)로 세션 탈취 방지
        #  - secure:    HTTPS 연결에서만 쿠키 전송 (운영은 전 구간 https)
        #  - same-site: 크로스사이트 요청 시 쿠키 미전송으로 CSRF 완화 (lax = 일반 링크 이동은 허용)
        http-only: true
        secure: true
        same-site: lax

logging:
  level:
    com.lightdrone: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.security.oauth2: INFO
    org.springframework.security.web: INFO
