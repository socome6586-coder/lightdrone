<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('제품 카테고리')}"></th:block>
    <style>
        /* ── 검색바 (밑줄형 미니멀) ── */
        .product-search { max-width: 300px; margin-left: auto; }
        .search-underline {
            display: flex; align-items: center; gap: 2px;
            border-bottom: 1.5px solid #d9dee6;
            transition: border-color .2s ease;
        }
        .search-underline:focus-within { border-bottom-color: #1a4fd8; }
        .search-underline .si-input {
            flex: 1 1 auto; min-width: 0;
            border: none; background: transparent;
            padding: 8px 2px; font-size: .82rem; color: #333;
        }
        .search-underline .si-input:focus { outline: none; box-shadow: none; }
        .search-underline .si-input::placeholder { color: #aab1bb; }
        .search-underline .si-clear,
        .search-underline .si-btn {
            border: none; background: transparent; line-height: 1;
            display: inline-flex; align-items: center; cursor: pointer;
            padding: 6px; text-decoration: none;
        }
        .search-underline .si-clear { color: #b6bcc6; font-size: .95rem; }
        .search-underline .si-clear:hover { color: #6b7280; }
        .search-underline .si-btn { color: #1a4fd8; font-size: 1rem; }
        .search-underline .si-btn:hover { color: #1040bc; }

        /* ── 카테고리 상품 갯수 ── */
        .product-count { font-size: .82rem; color: #6b7280; margin-bottom: 1rem; }
        .product-count strong { color: #1a4fd8; font-weight: 700; }

        /* ── 카테고리 네비게이션 ── */
        .cat-nav { display:flex; flex-wrap:wrap; border-bottom:2px solid #e9ecef; margin-bottom:1.5rem; gap:0; }
        .cat-item { position:relative; }
        .cat-link {
            display:flex; align-items:center; gap:5px;
            padding:11px 20px; font-size:.875rem; font-weight:500;
            color:#495057; text-decoration:none; white-space:nowrap;
            border-bottom:3px solid transparent; transition:color .15s, background .15s;
            background:transparent;
        }
        .cat-link:hover { color:var(--bs-primary); background:#f5f7ff; }
        .cat-link.active { color:var(--bs-primary); border-bottom-color:var(--bs-primary); font-weight:700; }

        /* ── 선택된 세부 카테고리 표시 바 (밑줄형 텍스트) ── */
        .subcat-bar { display:flex; flex-wrap:wrap; gap:.35rem 1.05rem; margin-bottom:1.25rem; align-items:center; }
        .subcat-pill {
            position:relative; padding:5px 2px; font-size:.83rem; font-weight:500;
            text-decoration:none; color:#6b7280; background:transparent; border:none;
            transition:color .15s ease; white-space:nowrap;
        }
        .subcat-pill::after {
            content:""; position:absolute; left:2px; right:2px; bottom:-1px;
            height:2px; border-radius:2px; background:var(--bs-primary);
            transform:scaleX(0); transform-origin:left; transition:transform .2s ease;
        }
        .subcat-pill:hover { color:var(--bs-primary); }
        .subcat-pill:hover::after { transform:scaleX(.55); }
        .subcat-pill.active { color:var(--bs-primary); font-weight:700; }
        .subcat-pill.active::after { transform:scaleX(1); }

        /* ── 제품 카드 (메인 페이지와 동일) ── */
        .products-grid { --bs-gutter-x:.75rem; --bs-gutter-y:.75rem; }
        .home-prod-card {
            border-radius: 10px; overflow: hidden; background: #fff;
            border: 1px solid #eee; box-shadow: none !important;
            transition: border-color .2s ease;
        }
        .home-prod-card:hover { border-color: #d0d0d0; }
        .product-img-box {
            position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #f7f8fa;
        }
        .prod-img-link { display: block; width: 100%; height: 100%; }
        .home-prod-img { width: 100%; height: 100%; object-fit: contain; }
        /* 이미지 하단 라벨 띠 (관리자 '이미지에 이름 표시' 체크 시) */
        .prod-img-label {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
            background: #1f9d88; color: #fff;
            font-size: .92rem; font-weight: 700; letter-spacing: -.01em;
            text-align: center; padding: .5em .6em; line-height: 1.25;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sample-img-wrap {
            position: relative; aspect-ratio: 1 / 1;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #fafbfc 0%, #f1f3f6 100%); font-size: 3rem;
        }
        /* 호버 시 떠오르는 장바구니 버튼 */
        .home-cart-fab {
            position: absolute; right: 5px; bottom: 5px;
            width: 38px; height: 38px; border: 1px solid #dbe4ff; border-radius: 0;
            background: rgba(255,255,255,.96); color: #0d6efd;
            display: flex; align-items: center; justify-content: center;
            font-size: .95rem; text-decoration: none; cursor: pointer; z-index: 3;
            box-shadow: 0 8px 18px rgba(15,23,42,.12);
            opacity: 0; transform: translateY(8px);
            transition: opacity .18s ease, transform .18s ease, background .15s ease, color .15s ease, border-color .15s ease;
        }
        .home-prod-card:hover .home-cart-fab { opacity: 1; transform: translateY(0); }
        .home-cart-fab:hover { background: #0d6efd; border-color: #0d6efd; color: #fff; transform: translateY(0); }
        .home-soldout-badge {
            position: absolute; right: 12px; bottom: 12px;
            background: rgba(17,24,39,.72); color: #fff;
            font-size: .72rem; font-weight: 600; padding: .32em .8em; border-radius: 20px; z-index: 3;
        }
        @media (hover: none) { .home-cart-fab { opacity: 1; transform: none; } }
        /* 본문 */
        .home-prod-card .card-body { padding: .65rem .75rem; }
        .home-prod-name {
            font-size: .85rem; font-weight: 600; line-height: 1.3;
            min-height: 3.3em; display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden; margin-bottom: .25rem;
        }
        .home-prod-name a:hover { color: var(--bs-primary) !important; }
        .home-prod-price { font-size: .95rem; font-weight: 800; color: #1a4fd8; letter-spacing: -.02em; }
        .home-prod-meta { display: flex; gap: 6px; font-size: .72rem; line-height: 1.5; }
        .home-prod-meta .hpm-label { color: #aaa; min-width: 42px; flex-shrink: 0; }
        .home-prod-meta .hpm-value { color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ── 모바일 (≤767px) ── */
        @media (max-width: 767px) {
            /* 카테고리 탭 / 세부 카테고리 → 가로 스크롤 (줄바꿈 방지) */
            .cat-nav, .subcat-bar {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .cat-nav::-webkit-scrollbar,
            .subcat-bar::-webkit-scrollbar { display: none; }
            .cat-nav > .cat-item,
            .subcat-bar > * { flex: 0 0 auto; }
            .cat-link { padding: 10px 16px; }

            /* 그리드 간격 축소 (4열) */
            .products-grid { --bs-gutter-x: 0.4rem; --bs-gutter-y: 0.5rem; }
            .home-prod-card .card-body { padding: 0.4rem 0.45rem !important; }
            .home-prod-meta { display: none !important; }   /* 4열: 코드·카테고리·후기 숨김 */
            .home-prod-name { font-size: 0.72rem; -webkit-line-clamp: 3; margin-bottom: 0.2rem; }
            .home-prod-price { font-size: 0.78rem; }
            .home-cart-fab { width: 28px; height: 28px; font-size: 0.72rem; right: 3px; bottom: 3px; box-shadow: 0 5px 12px rgba(15,23,42,.12); }
            .prod-img-label { display: none !important; }
            .prod-ribbons { top: 6px; gap: 3px; }
            .prod-ribbon {
                min-width: 36px;
                padding: 3px 6px 3px 9px;
                font-size: .48rem;
                letter-spacing: .03em;
            }
            .prod-ribbon.rb-soldout {
                min-width: 44px;
                padding: 4px 7px 4px 11px;
                font-size: .54rem;
                letter-spacing: .05em;
            }
            .pagination {
                max-width: 100%;
                flex-wrap: wrap;
                gap: .15rem;
            }
        }
    </style>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">제품 카테고리</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white-50">홈</a></li>
                <li class="breadcrumb-item active text-white">제품 카테고리</li>
            </ol>
        </nav>
    </div>
</div>

<section class="section-padding">
    <div class="container">

        <!-- ── 검색바 ── -->
        <form th:action="@{/products}" method="get" class="mb-4 product-search">
            <!-- 선택한 카테고리·세부분류를 유지한 채로 검색 -->
            <input type="hidden" name="category" th:value="${category}">
            <input type="hidden" name="subcategory" th:value="${subcategory}">
            <div class="search-underline">
                <input type="text" name="keyword" class="si-input"
                       placeholder="제품명 또는 상품코드를 검색해주세요"
                       th:value="${keyword}">
                <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
                   th:href="@{/products(category=${category}, subcategory=${subcategory})}" class="si-clear" title="검색어 지우기">
                    <i class="bi bi-x-lg"></i>
                </a>
                <button type="submit" class="si-btn" title="검색">
                    <i class="bi bi-search"></i>
                </button>
            </div>
            <span th:if="${keyword != null and !#strings.isEmpty(keyword)}"
                  class="small text-muted mt-1 d-inline-block">
                "<span th:text="${keyword}"></span>" 검색 결과
                <span th:text="'(' + ${productPage.totalElements} + '건)'"  class="fw-semibold"></span>
            </span>
        </form>

        <!-- ── 카테고리 네비게이션 (네모 탭 + 호버 드롭다운) ── -->
        <nav class="cat-nav">
            <!-- 전체 -->
            <div class="cat-item">
                <a th:href="@{/products}"
                   th:classappend="${#strings.isEmpty(category)} ? 'active'"
                   class="cat-link">전체</a>
            </div>
            <!-- 카테고리별 (클릭 시 바로 이동, 세부카테고리는 하단 바에 표시) -->
            <div class="cat-item" th:each="cat : ${allCategories}">
                <a th:href="@{/products(category=${cat.name})}"
                   th:classappend="${category == cat.name} ? 'active'"
                   class="cat-link">
                    <span th:text="${cat.name}"></span>
                </a>
            </div>
        </nav>

        <!-- 선택된 세부 카테고리 표시 바 (카테고리가 선택됐을 때) -->
        <div th:if="${subcategories != null and !#lists.isEmpty(subcategories)}" class="subcat-bar">
            <span class="text-muted small fw-semibold me-1" th:text="${category} + ' ›'"></span>
            <a th:href="@{/products(category=${category})}"
               th:classappend="${#strings.isEmpty(subcategory)} ? 'active'"
               class="subcat-pill">전체</a>
            <a th:each="sub : ${subcategories}"
               th:href="@{/products(category=${category},subcategory=${sub})}"
               th:classappend="${subcategory == sub} ? 'active'"
               th:text="${sub}"
               class="subcat-pill"></a>
        </div>

        <!-- 카테고리 상품 갯수 -->
        <div class="product-count">
            <strong th:text="${productPage.totalElements}">0</strong>개 상품
        </div>

        <!-- 알림 토스트 -->
        <div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
            <div id="cartToast" class="toast text-bg-success border-0" role="alert">
                <div class="toast-body">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-cart-check me-2 flex-shrink-0"></i>
                        <span id="cartToastMsg" class="fw-semibold flex-grow-1">장바구니에 담았습니다.</span>
                        <button type="button" class="btn-close btn-close-white ms-2 flex-shrink-0" data-bs-dismiss="toast"></button>
                    </div>
                    <div id="cartToastActions" class="d-none">
                        <a href="/cart" class="btn btn-sm btn-light w-100 fw-semibold text-success">
                            <i class="bi bi-cart3 me-1"></i>장바구니로 이동
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 제품 목록 -->
        <div class="row g-3 products-grid row-cols-2 row-cols-md-4 row-cols-lg-5" th:if="${!productPage.isEmpty()}">
            <div class="col" th:each="product : ${productPage.content}">
                <div class="card h-100 home-prod-card prod-ribbon-host">
                    <!-- BEST / NEW / 할인 리본 (우측 상단) -->
                    <div class="prod-ribbons">
                        <span th:unless="${product.stock > 0}" class="prod-ribbon rb-soldout">품절</span>
                        <span th:if="${product.newProduct}" class="prod-ribbon rb-new">NEW</span>
                        <span th:if="${product.best}" class="prod-ribbon rb-best">BEST</span>
                        <span th:if="${product.onSale}" class="prod-ribbon rb-sale"
                              th:text="${product.discountPercent} + '%'">10%</span>
                    </div>
                    <!-- 이미지 + 호버 장바구니 -->
                    <div th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                         class="product-img-box">
                        <a th:href="@{/products/{id}(id=${product.id})}" class="prod-img-link">
                            <img th:src="@{${product.imageUrl}}" class="home-prod-img" th:alt="${product.name}" loading="lazy">
                        </a>
                        <button th:if="${product.stock > 0}"
                                type="button" class="home-cart-fab home-btn-cart"
                                th:data-product-id="${product.id}"
                                th:data-csrf="${_csrf.token}"
                                th:data-csrf-header="${_csrf.headerName}"
                                title="장바구니에 담기">
                            <i class="bi bi-cart-plus"></i>
                        </button>
                        <span th:if="${product.imageLabelVisible}" class="prod-img-label"
                              th:text="${product.imageLabel}">라벨</span>
                    </div>
                    <div th:unless="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                         class="sample-img-wrap">
                        <a th:href="@{/products/{id}(id=${product.id})}"
                           class="prod-img-link d-flex align-items-center justify-content-center">
                            <i class="bi bi-box-seam text-secondary"></i>
                        </a>
                        <button th:if="${product.stock > 0}"
                                type="button" class="home-cart-fab home-btn-cart"
                                th:data-product-id="${product.id}"
                                th:data-csrf="${_csrf.token}"
                                th:data-csrf-header="${_csrf.headerName}"
                                title="장바구니에 담기">
                            <i class="bi bi-cart-plus"></i>
                        </button>
                    </div>
                    <div class="card-body p-3 d-flex flex-column">
                        <h6 class="home-prod-name mb-2">
                            <a th:href="@{/products/{id}(id=${product.id})}"
                               th:text="${product.name}"
                               class="text-decoration-none text-dark"></a>
                        </h6>
                        <div class="home-prod-price mb-2">
                            <span th:if="${product.priceOnRequest}">가격문의요망</span>
                            <th:block th:unless="${product.priceOnRequest}">
                                <span th:if="${product.onSale}">
                                    <span class="hp-original"
                                          th:text="${#numbers.formatInteger(product.price,0,'COMMA') + '원'}"></span>
                                    <span class="hp-sale-group">
                                        <span class="hp-current"
                                              th:text="${#numbers.formatInteger(product.effectivePrice,0,'COMMA') + '원'}"></span>
                                        <span class="hp-pct" th:text="${product.discountPercent} + '%'"></span>
                                    </span>
                                </span>
                                <span th:unless="${product.onSale}"
                                      th:text="${#numbers.formatInteger(product.headlinePrice,0,'COMMA') + '원'}"></span>
                            </th:block>
                        </div>
                        <div class="mt-auto">
                            <div class="home-prod-meta" th:if="${product.productCode != null and !#strings.isEmpty(product.productCode)}">
                                <span class="hpm-label">코드</span>
                                <span class="hpm-value" th:text="${product.productCode}"></span>
                            </div>
                            <div class="home-prod-meta">
                                <span class="hpm-label">카테고리</span>
                                <span class="hpm-value"
                                      th:text="${product.subcategory != null and !#strings.isEmpty(product.subcategory) ? product.subcategory : product.category}"></span>
                            </div>
                            <div class="home-prod-meta">
                                <span class="hpm-label">구매후기</span>
                                <span class="hpm-value"
                                      th:text="${(reviewCounts != null and reviewCounts.containsKey(product.id) ? reviewCounts.get(product.id) : 0) + '건'}">0건</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 빈 상태 -->
        <div class="text-center py-5" th:if="${productPage.isEmpty()}">
            <i class="bi bi-box-seam text-muted" style="font-size:3.5rem;"></i>
            <p class="text-muted mt-3 mb-1 fw-semibold">등록된 제품이 없습니다.</p>
            <p class="text-muted small">제품 문의는 아래 버튼을 이용해 주세요.</p>
            <a th:href="@{/inquiry}" class="btn btn-primary mt-2">
                <i class="bi bi-chat-dots me-1"></i>견적 문의하기
            </a>
        </div>

        <!-- 페이지네이션 -->
        <nav th:if="${productPage.totalPages > 1}" class="mt-5 d-flex justify-content-center">
            <ul class="pagination">
                <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/products(page=${productPage.number - 1}, category=${category}, subcategory=${subcategory}, keyword=${keyword})}">‹</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                    th:classappend="${i == productPage.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/products(page=${i}, category=${category}, subcategory=${subcategory}, keyword=${keyword})}"
                       th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/products(page=${productPage.number + 1}, category=${category}, subcategory=${subcategory}, keyword=${keyword})}">›</a>
                </li>
            </ul>
        </nav>

    </div>
</section>

<script>
/* 장바구니 담기 (AJAX — JSON API, 토스트 알림) */
const cartToastEl = document.getElementById('cartToast');

function showCartToast(msg, isError) {
    document.getElementById('cartToastMsg').textContent = msg;
    const actions = document.getElementById('cartToastActions');
    if (isError) {
        cartToastEl.classList.remove('text-bg-success');
        cartToastEl.classList.add('text-bg-danger');
        actions.classList.add('d-none');
    } else {
        cartToastEl.classList.remove('text-bg-danger');
        cartToastEl.classList.add('text-bg-success');
        actions.classList.remove('d-none');
    }
    // 오류: 3.5초 후 자동 닫힘 / 성공: 닫기 버튼 누를 때까지 유지
    new bootstrap.Toast(cartToastEl, isError ? { delay: 3500 } : { autohide: false }).show();
}

/* ── 수량 +/- 버튼 ── */
document.querySelectorAll('.qty-minus, .qty-plus').forEach(btn => {
    btn.addEventListener('click', function () {
        const group    = this.closest('.qty-group');
        const input    = group.querySelector('.cart-qty-input');
        const maxStock = parseInt(input.getAttribute('max'), 10) || 999;
        let v = parseInt(input.value, 10) || 1;
        if (this.classList.contains('qty-minus')) v = Math.max(1, v - 1);
        else                                       v = Math.min(maxStock, v + 1);
        input.value = v;
    });
});

/* ── 장바구니 담기 버튼 ── */
document.querySelectorAll('.btn-cart-add').forEach(btn => {
    btn.addEventListener('click', async function () {
        const productId  = this.dataset.productId;
        const csrfToken  = this.dataset.csrf;
        const csrfHeader = this.dataset.csrfHeader;
        const name       = this.dataset.productName;
        const hasOptions = this.dataset.hasOptions === 'true';

        /* 같은 카드 내 수량 입력 읽기 */
        const cardBody = this.closest('.card-body');
        const qtyInput = cardBody ? cardBody.querySelector('.cart-qty-input') : null;
        const quantity = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;

        /* 옵션 선택 읽기 (그룹별 드롭다운 — 모두 선택돼야 함) */
        const optSelects = cardBody ? Array.from(cardBody.querySelectorAll('.cart-option-select')) : [];
        const optionIds = [];
        let missingSel = null;
        optSelects.forEach(sel => {
            if (sel.value) optionIds.push(sel.value);
            else if (!missingSel) missingSel = sel;
        });
        if (hasOptions && missingSel) {
            showCartToast('옵션을 모두 선택해 주세요.', true);
            missingSel.focus();
            return;
        }

        this.disabled = true;
        this.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>담는 중...';

        const params = new URLSearchParams();
        params.append('productId', productId);
        params.append('quantity', quantity);
        optionIds.forEach(id => params.append('optionId', id));

        try {
            const res = await fetch('/cart/add/ajax', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    [csrfHeader]: csrfToken
                },
                body: new URLSearchParams(params)
            });

            const data = await res.json();

            if (data.success) {
                this.classList.add('added');
                this.innerHTML = '<i class="bi bi-cart-check me-1"></i>담겼습니다!';

                /* 장바구니 뱃지 카운트 갱신 */
                const badge = document.getElementById('cartBadge');
                if (badge && data.count !== undefined) badge.textContent = data.count;
                /* 플로팅 사이드바 장바구니 즉시 갱신 */
                if (typeof window.refreshCartSidebar === 'function') window.refreshCartSidebar();

                /* 성공 토스트 */
                showCartToast('"' + name + '" 을(를) 장바구니에 담았습니다.', false);

                /* 2.5초 후 버튼 원복, 수량 1로 리셋 */
                setTimeout(() => {
                    this.classList.remove('added');
                    this.innerHTML = '<i class="bi bi-cart-plus me-1"></i>장바구니 담기';
                    this.disabled = false;
                    if (qtyInput) qtyInput.value = 1;
                }, 2600);
            } else {
                /* 재고 부족 등 오류 토스트 */
                showCartToast(data.message || '장바구니 담기에 실패했습니다.', true);
                this.innerHTML = '<i class="bi bi-cart-plus me-1"></i>장바구니 담기';
                this.disabled = false;
            }
        } catch (e) {
            this.innerHTML = '<i class="bi bi-cart-plus me-1"></i>장바구니 담기';
            this.disabled = false;
            alert('장바구니 담기에 실패했습니다. 다시 시도해주세요.');
        }
    });
});

/* ── 카드 호버 장바구니 버튼 (메인 페이지와 동일) ── */
document.querySelectorAll('.home-btn-cart').forEach(function (btn) {
    btn.addEventListener('click', async function () {
        const productId  = this.dataset.productId;
        const csrfToken  = this.dataset.csrf;
        const csrfHeader = this.dataset.csrfHeader;
        this.disabled = true;
        this.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        try {
            const res = await fetch('/cart/add/ajax', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', [csrfHeader]: csrfToken },
                body: 'productId=' + productId + '&quantity=1'
            });
            const data = await res.json().catch(() => ({}));
            if (data.success) {
                this.innerHTML = '<i class="bi bi-cart-check"></i>';
                const badge = document.getElementById('cartBadge');
                if (badge && data.count !== undefined) badge.textContent = data.count;
                if (typeof window.refreshCartSidebar === 'function') window.refreshCartSidebar();
                showCartToast('장바구니에 담았습니다.', false);
                setTimeout(() => {
                    this.innerHTML = '<i class="bi bi-cart-plus"></i>';
                    this.disabled = false;
                }, 1500);
            } else {
                showCartToast(data.message || '담기 실패. 옵션이 있는 상품은 상세페이지에서 담아주세요.', true);
                this.innerHTML = '<i class="bi bi-cart-plus"></i>';
                this.disabled = false;
            }
        } catch (e) {
            showCartToast('오류가 발생했습니다.', true);
            this.innerHTML = '<i class="bi bi-cart-plus"></i>';
            this.disabled = false;
        }
    });
});

</script>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
