<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/fragments :: head('구매 후기')}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">구매 후기</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white-50">홈</a></li>
                <li class="breadcrumb-item"><a th:href="@{/review}" class="text-white-50">구매 후기</a></li>
                <li class="breadcrumb-item active text-white">상세</li>
            </ol>
        </nav>
    </div>
</div>

<section class="section-padding">
    <div class="container">

                <div th:if="${successMsg}" class="alert alert-success mb-3">
                    <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
                </div>

                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-header bg-white py-3">
                        <div class="d-flex justify-content-between align-items-start gap-2">
                            <div>
                                <span th:if="${review.productName != null}"
                                      class="badge bg-light text-dark border mb-1" th:text="${review.productName}">제품명</span>
                                <h5 class="fw-bold mb-0" th:text="${review.title}">제목</h5>
                            </div>
                        </div>
                        <div class="d-flex gap-3 mt-2 text-muted small">
                            <span>
                                <i class="bi bi-person me-1"></i>
                                <span th:text="${review.member != null ? review.member.name : '알 수 없음'}">작성자</span>
                            </span>
                            <span>
                                <i class="bi bi-clock me-1"></i>
                                <span th:text="${#temporals.format(review.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</span>
                            </span>
                            <span>
                                <i class="bi bi-eye me-1"></i>
                                <span th:text="${review.viewCount}">0</span>
                            </span>
                        </div>
                    </div>
                    <div class="card-body p-4">
                        <!-- 첨부 이미지 (다중) -->
                        <div th:if="${!#lists.isEmpty(review.imageUrls)}" class="mb-4 d-flex flex-column gap-3 align-items-center">
                            <img th:each="url : ${review.imageUrls}" th:src="${url}" alt="첨부 이미지"
                                 class="img-fluid rounded shadow-sm" style="max-width:100%;max-height:500px;">
                        </div>
                        <div th:if="${#lists.isEmpty(review.imageUrls) and review.imageUrl != null}" class="mb-4 text-center">
                            <img th:src="${review.imageUrl}" alt="첨부 이미지"
                                 class="img-fluid rounded shadow-sm" style="max-width:100%;max-height:500px;">
                        </div>
                        <div style="word-break:break-word; line-height:1.8;"
                             th:utext="${review.content}"></div>
                    </div>
                </div>

                <!-- 관리자 답글 -->
                <div th:if="${review.adminReply != null and !#strings.isEmpty(review.adminReply)}"
                     class="card border-start border-primary border-3 bg-light mt-4">
                    <div class="card-body">
                        <div class="fw-bold text-primary mb-2"><i class="bi bi-shield-check me-1"></i>관리자 답글</div>
                        <div th:utext="${review.adminReply}" style="word-break:break-word;line-height:1.8;"></div>
                        <div class="text-muted small mt-2" th:if="${review.adminReplyAt != null}"
                             th:text="${#temporals.format(review.adminReplyAt,'yyyy.MM.dd HH:mm')}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a th:href="@{/review}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>목록으로
                    </a>
                    <div class="d-flex gap-2" th:if="${isOwner}">
                        <a th:href="@{/review/{id}/edit(id=${review.id})}" class="btn btn-outline-primary">
                            <i class="bi bi-pencil me-1"></i>수정
                        </a>
                        <form th:action="@{/review/{id}/delete(id=${review.id})}" method="post"
                              onsubmit="return confirm('후기를 삭제하시겠습니까?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>삭제
                            </button>
                        </form>
                    </div>
                </div>

    </div>
</section>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
