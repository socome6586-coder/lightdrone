<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/fragments :: head('구매 후기 작성')}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs5.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">구매 후기 작성</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white-50">홈</a></li>
                <li class="breadcrumb-item"><a th:href="@{/review}" class="text-white-50">구매 후기</a></li>
                <li class="breadcrumb-item active text-white">후기 작성</li>
            </ol>
        </nav>
    </div>
</div>

<section class="section-padding">
    <div class="container">
        <div class="row g-4">
            <th:block th:replace="~{layout/fragments :: mypageSidebar('review')}"></th:block>
            <div class="col-md-9">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <span class="fw-bold">
                            <i class="bi bi-pencil-square me-2 text-warning"></i>후기 작성
                        </span>
                    </div>
                    <div class="card-body p-4">

                        <div th:if="${errorMsg}" class="alert alert-danger py-2 small">
                            <span th:text="${errorMsg}"></span>
                        </div>

                        <form th:action="@{/review/write}" th:object="${reviewDto}"
                              method="post" enctype="multipart/form-data" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- 구매한 제품 선택 -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">구매한 제품 <span class="text-danger">*</span></label>
                                <input type="hidden" name="productId" id="productId" th:value="${reviewDto.productId}">
                                <div class="d-flex align-items-center gap-2 flex-wrap">
                                    <button type="button" class="rv-product-btn"
                                            data-bs-toggle="modal" data-bs-target="#productModal">
                                        구매한 제품 선택
                                    </button>
                                    <div id="selectedProductBox" class="d-none align-items-center gap-2 border rounded px-2 py-1">
                                        <img id="selectedProductImg" src="" alt="선택한 제품"
                                             style="width:34px;height:34px;object-fit:cover;border:1px solid #eee;border-radius:4px;">
                                        <span id="selectedProductName" class="small fw-semibold"></span>
                                        <button type="button" class="btn-close ms-1" style="font-size:.6rem;"
                                                onclick="clearSelectedProduct()" aria-label="선택 해제"></button>
                                    </div>
                                </div>
                                <div id="noProductMsg" class="form-text text-muted">실제 구매하신 제품만 선택할 수 있습니다.</div>
                            </div>

                            <!-- 별점 -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">별점 <span class="text-danger">*</span></label>
                                <div class="star-input">
                                    <input type="radio" name="rating" id="star5" value="5" th:checked="${reviewDto.rating == null or reviewDto.rating == 5}"><label for="star5"><i class="bi bi-star-fill"></i></label>
                                    <input type="radio" name="rating" id="star4" value="4" th:checked="${reviewDto.rating == 4}"><label for="star4"><i class="bi bi-star-fill"></i></label>
                                    <input type="radio" name="rating" id="star3" value="3" th:checked="${reviewDto.rating == 3}"><label for="star3"><i class="bi bi-star-fill"></i></label>
                                    <input type="radio" name="rating" id="star2" value="2" th:checked="${reviewDto.rating == 2}"><label for="star2"><i class="bi bi-star-fill"></i></label>
                                    <input type="radio" name="rating" id="star1" value="1" th:checked="${reviewDto.rating == 1}"><label for="star1"><i class="bi bi-star-fill"></i></label>
                                </div>
                            </div>

                            <!-- 제목 -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control rv-square-input"
                                       th:field="*{title}"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                       placeholder="제목을 입력하세요" maxlength="200">
                                <div class="invalid-feedback" th:errors="*{title}"></div>
                            </div>

                            <!-- 내용 -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">내용 <span class="text-danger">*</span></label>
                                <textarea class="form-control"
                                          th:field="*{content}"
                                          th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                                          rows="10" placeholder="구매 후기를 작성해 주세요"></textarea>
                                <div class="invalid-feedback" th:errors="*{content}"></div>
                            </div>

                            <!-- 이미지 첨부 (다중) -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    이미지 첨부
                                    <span class="text-muted fw-normal small ms-1">(jpg, png, gif, webp / 여러 장 선택 가능)</span>
                                </label>
                                <input type="file" name="imageFiles" id="imageFiles" class="form-control" multiple
                                       accept="image/jpeg,image/png,image/gif,image/webp">
                                <div class="form-text text-muted">한 장당 최대 10MB</div>
                                <div id="imgPreview" class="d-flex flex-wrap gap-2 mt-2"></div>
                            </div>

                            <!-- 안내 문구 -->
                            <div class="rv-notice small text-muted">
                                · 상품과 관련없는 내용 또는 이미지, 욕설/비방, 개인정보유출, 광고/홍보글 등 적절하지 않은 게시물은 별도의 고지없이 비공개 처리 될 수 있습니다.<br>
                                · 작성된 게시물(사진, 동영상 포함)은 운영 및 마케팅에 활용될 수 있습니다.
                            </div>

                            <div class="d-flex justify-content-center gap-3 mt-4">
                                <button type="submit" class="btn btn-primary rv-form-btn">등록하기</button>
                                <a th:href="@{/review}" class="btn btn-outline-secondary rv-form-btn">취소</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- 구매한 제품 선택 모달 -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">구매한 제품 선택</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div th:if="${#lists.isEmpty(purchasedProducts)}" class="text-center text-muted py-4">
                    구매한 제품이 없습니다.<br>제품 구매 후 후기를 작성할 수 있습니다.
                </div>
                <div class="list-group">
                    <button type="button"
                            class="list-group-item list-group-item-action d-flex align-items-center gap-3"
                            th:each="pp : ${purchasedProducts}"
                            th:data-id="${pp.id}" th:data-name="${pp.name}"
                            th:data-img="${pp.imageUrl != null ? pp.imageUrl : ''}"
                            onclick="selectProduct(this)">
                        <img th:if="${pp.imageUrl != null}" th:src="${pp.imageUrl}" alt="제품 이미지"
                             style="width:46px;height:46px;object-fit:cover;border:1px solid #eee;border-radius:6px;flex-shrink:0;">
                        <span th:if="${pp.imageUrl == null}"
                              style="width:46px;height:46px;background:#f1f3f6;border:1px solid #eee;border-radius:6px;flex-shrink:0;"></span>
                        <span class="small fw-semibold text-start" th:text="${pp.name}">제품명</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .rv-form-btn { width: 170px; border-radius: 0; padding: .6rem 0; font-weight: 600; }
    .rv-notice {
        border: 1px solid #eef0f3; background: #fafbfc; border-radius: 6px;
        padding: 12px 14px; line-height: 1.7; margin-top: 4px;
    }
    /* 구매한 제품 선택 — 검정 네모 버튼 */
    .rv-product-btn {
        background: #111; color: #fff; border: 1px solid #111; border-radius: 0;
        padding: .45rem 1rem; font-size: .85rem; font-weight: 600; line-height: 1;
        transition: background .15s, border-color .15s;
    }
    .rv-product-btn:hover { background: #000; border-color: #000; }
    /* 별점 크기 1.5배 축소 (1.7rem → 1.13rem) */
    .star-input label { font-size: 1.13rem; }
    /* 제목 입력칸 네모 */
    .rv-square-input { border-radius: 0; }
    #selectedProductBox.show-flex { display: inline-flex !important; }
    .rv-img-thumb {
        position: relative; width: 70px; height: 70px; border-radius: 6px;
        overflow: hidden; border: 1px solid #e5e8ec;
    }
    .rv-img-thumb img { width: 100%; height: 100%; object-fit: cover; }
</style>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/lang/summernote-ko-KR.min.js"></script>
<script>
$(function () {
    $('#content').summernote({
        lang: 'ko-KR',
        dialogsInBody: true,
        height: 300,
        placeholder: '구매 후기를 작성해 주세요',
        toolbar: [
            ['font',     ['bold','italic','underline','strikethrough','clear']],
            ['fontname', ['fontname']],
            ['fontsize', ['fontsize']],
            ['color',    ['color']],
            ['para',     ['ul','ol','paragraph']],
            ['insert',   ['picture']],
            ['view',     ['undo','redo','fullscreen']],
        ],
        fontNames: ['Noto Sans KR','Arial','Arial Black','Courier New','Helvetica','Times New Roman'],
        fontSizes: ['10','11','12','13','14','16','18','20','24','28','36'],
        callbacks: {
            onImageUpload: function (files) {
                uploadEditorImage(files, $(this));
            }
        }
    });

    /* Bootstrap 5 동적 드롭다운 수동 토글 */
    $(document).on('click', '.note-toolbar .dropdown-toggle', function () {
        const $parent = $(this).closest('.note-btn-group, .btn-group');
        const $menu   = $parent.find('> .dropdown-menu, > .note-dropdown-menu').first();
        if (!$menu.length) return;
        const willOpen = !$menu.hasClass('show');
        $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        if (willOpen) $menu.addClass('show');
    });
    $(document).on('click', function (e) {
        if (!$(e.target).closest('.note-toolbar .note-btn-group, .note-toolbar .btn-group').length) {
            $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        }
    });

    $('form').on('submit', function () {
        $('#content').val($('#content').summernote('code'));
    });

    /* 다중 이미지 미리보기 */
    $('#imageFiles').on('change', function () {
        const box = document.getElementById('imgPreview');
        box.innerHTML = '';
        Array.from(this.files).forEach(function (file) {
            if (!file.type.startsWith('image/')) return;
            const div = document.createElement('div');
            div.className = 'rv-img-thumb';
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            div.appendChild(img);
            box.appendChild(div);
        });
    });
});

/* Summernote 에디터 내 이미지 업로드 → 서버 저장 후 URL 삽입 */
function uploadEditorImage(files, $editor) {
    Array.from(files).forEach(function (file) {
        if (!file.type.startsWith('image/')) return;
        var fd = new FormData();
        fd.append('file', file);
        $.ajax({
            url: '/api/upload-image',
            method: 'POST',
            data: fd,
            contentType: false,
            processData: false,
            success: function (res) {
                if (res && res.url) {
                    $editor.summernote('insertImage', res.url);
                } else {
                    alert('이미지 업로드에 실패했습니다.');
                }
            },
            error: function () {
                alert('이미지 업로드에 실패했습니다. (로그인 상태와 파일 형식을 확인하세요)');
            }
        });
    });
}

/* 구매 제품 선택 (모달 → 폼 미리보기) */
function selectProduct(btn) {
    document.getElementById('productId').value = btn.dataset.id;
    document.getElementById('selectedProductName').textContent = btn.dataset.name;
    const img = document.getElementById('selectedProductImg');
    if (btn.dataset.img) { img.src = btn.dataset.img; img.style.display = ''; }
    else { img.style.display = 'none'; }
    const box = document.getElementById('selectedProductBox');
    box.classList.remove('d-none');
    box.classList.add('show-flex');
    document.getElementById('noProductMsg').classList.add('d-none');
    const modalEl = document.getElementById('productModal');
    const modal = bootstrap.Modal.getInstance(modalEl);
    if (modal) modal.hide();
}
function clearSelectedProduct() {
    document.getElementById('productId').value = '';
    const box = document.getElementById('selectedProductBox');
    box.classList.add('d-none');
    box.classList.remove('show-flex');
    document.getElementById('noProductMsg').classList.remove('d-none');
}
</script>
</body>
</html>
