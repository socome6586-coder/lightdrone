<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('제품 메뉴얼')}"></th:block>
    <style>
        .manual-content { line-height:1.9; font-size:1rem; }
        .manual-content p { margin-bottom:1rem; }
        .manual-content h1,.manual-content h2,.manual-content h3 { margin-top:1.5rem; margin-bottom:.75rem; font-weight:700; }
        .manual-content ul,.manual-content ol { padding-left:1.5rem; margin-bottom:1rem; }
        .manual-content img { max-width:100%; height:auto; }
        .manual-detail-btn { border-radius:0; padding:.45rem 1.15rem; font-weight:600; font-size:.9rem; }
    </style>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">제품 메뉴얼</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white-50">홈</a></li>
                <li class="breadcrumb-item"><a th:href="@{/support}" class="text-white-50">제품지원 및 메뉴얼</a></li>
                <li class="breadcrumb-item active text-white">상세</li>
            </ol>
        </nav>
    </div>
</div>

<section class="section-padding">
    <div class="container">
        <div class="row">
            <div class="col-12">

                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom p-4">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span th:if="${manual.pinned}" class="badge bg-primary">고정</span>
                            <span th:if="${manual.category}" class="badge bg-light text-secondary border"
                                  th:text="${manual.category}"></span>
                            <h4 class="mb-0" th:text="${manual.title}">제목</h4>
                        </div>
                        <div class="d-flex gap-3 text-muted small">
                            <span><i class="bi bi-person me-1"></i>관리자</span>
                            <span><i class="bi bi-calendar me-1"></i>
                                <span th:text="${#temporals.format(manual.createdAt, 'yyyy년 MM월 dd일')}"></span>
                            </span>
                            <span><i class="bi bi-eye me-1"></i>
                                <span th:text="${manual.viewCount}"></span>
                            </span>
                        </div>
                    </div>
                    <div class="card-body p-4">
                        <div class="manual-content" th:utext="${manual.content}" style="white-space: pre-wrap;">내용</div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/support}" class="btn btn-outline-secondary manual-detail-btn">
                        <i class="bi bi-list me-1"></i>목록으로
                    </a>
                    <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-2">
                        <a th:href="@{/admin/manuals/{id}/edit(id=${manual.id})}" class="btn btn-outline-primary manual-detail-btn">
                            <i class="bi bi-pencil me-1"></i>수정
                        </a>
                        <form th:action="@{/admin/manuals/{id}/delete(id=${manual.id})}" method="post"
                              onsubmit="return confirm('삭제하시겠습니까?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-outline-danger manual-detail-btn">
                                <i class="bi bi-trash me-1"></i>삭제
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
