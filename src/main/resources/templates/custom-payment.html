<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('맞춤결제')}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header"><div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">맞춤결제</h1>
        <p class="lead mb-0">안내받으신 맞춤결제코드를 입력해 주세요.</p>
    </div>
</div>

<section class="section-padding">
    <div class="container" style="max-width:720px;">

        <!-- 숨김 CSRF (AJAX 결제 준비용) -->
        <input type="hidden" name="_csrf" th:value="${_csrf != null ? _csrf.token : ''}">

        <!-- 조회 결과 -->
        <div th:if="${searched}">
            <div th:if="${results == null or results.isEmpty()}" class="alert alert-warning text-center">
                <i class="bi bi-exclamation-circle me-2"></i>
                해당 코드로 등록된 결제 건이 없습니다. 코드를 다시 확인해 주세요.
            </div>

            <div th:unless="${results == null or results.isEmpty()}">
                <!-- 상품 상세 느낌의 맞춤결제 상세 -->
                <div class="card border-0 shadow-sm mb-4" th:each="cp : ${results}">
                    <div class="card-body p-4">
                        <div class="row g-4 align-items-center">
                            <div class="col-md-5">
                                <div class="cp-img-wrap">
                                    <img th:src="${cp.imageUrlOrDefault}" alt="맞춤결제">
                                    <div th:if="${cp.status.name() == 'PAID'}" class="cp-ribbon">결제완료</div>
                                </div>
                            </div>
                            <div class="col-md-7">
                                <h2 class="cp-name mb-3" th:text="${cp.name + ' 님'}">상품명 님</h2>
                                <div class="cp-info mb-3">
                                    <div class="cp-row">
                                        <span class="cp-label">맞춤결제코드</span>
                                        <span class="cp-value" th:text="${cp.code}">0000</span>
                                    </div>
                                    <div class="cp-row">
                                        <span class="cp-label">배송방법</span>
                                        <span class="cp-value" th:text="${cp.deliveryMethod}">택배</span>
                                    </div>
                                    <div class="cp-row">
                                        <span class="cp-label">가격</span>
                                        <span class="cp-value cp-price text-primary"
                                              th:text="${#numbers.formatInteger(cp.price, 0, 'COMMA') + '원'}">0원</span>
                                    </div>
                                </div>

                                <!-- 미결제: 결제 버튼 / 결제완료: 안내 -->
                                <div th:if="${cp.status.name() != 'PAID'}" class="d-flex gap-2">
                                    <button type="button" class="btn btn-primary flex-fill cpay-btn"
                                            th:data-id="${cp.id}"
                                            th:data-amount="${cp.price}">
                                        <i class="bi bi-credit-card me-2"></i>카드결제하기
                                    </button>
                                    <button type="button" class="btn btn-outline-primary flex-fill bank-btn"
                                            data-bs-toggle="modal" data-bs-target="#bankTransferModal"
                                            th:data-name="${cp.name}"
                                            th:data-amount="${cp.price}">
                                        <i class="bi bi-bank me-2"></i>무통장 입금
                                    </button>
                                </div>
                                <div th:if="${cp.status.name() == 'PAID'}"
                                     class="alert alert-success mb-0 py-2 text-center fw-semibold">
                                    <i class="bi bi-check-circle me-1"></i>결제가 완료된 건입니다.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <button type="button" class="btn btn-outline-primary" style="border-radius:0;"
                        data-bs-toggle="modal" data-bs-target="#customPayModal">다른 코드로 조회</button>
            </div>
        </div>

    </div>
</section>

<style>
    /* 입력창: 완전 사각형 + 파란 포커스 글로우 제거 */
    #customPayModal .form-control {
        border-radius: 0;
    }
    #customPayModal .form-control:focus {
        box-shadow: none;
        border-color: #8a909a;
    }
    /* 버튼: 조회(왼) · 취소(오) 를 좌우로 크게, 중앙 아래 배치 */
    #customPayModal .modal-footer {
        justify-content: center;
        gap: 10px;
        flex-wrap: nowrap;
    }
    #customPayModal .modal-footer .btn {
        flex: 1 1 0;
        margin: 0;
    }
    /* 맞춤결제 상세 — 폰트 작게 */
    .cp-name { font-size: 1.15rem; font-weight: 700; }
    .cp-info { border-top: 1px solid #eef0f3; }
    .cp-row {
        display: flex; align-items: center;
        padding: 9px 2px; border-bottom: 1px solid #eef0f3; font-size: .85rem;
    }
    .cp-label { width: 96px; flex-shrink: 0; color: #8a909a; font-weight: 600; }
    .cp-value { color: #1f2329; }
    .cp-price { font-size: 1.05rem; font-weight: 700; }
    /* 결제 버튼 완전 네모 + 작게 */
    .cpay-btn, .bank-btn { border-radius: 0; font-size: .9rem; }
    /* 이미지 — 정사각형으로 꽉 차게, 우측상단 리본 */
    .cp-img-wrap {
        position: relative; overflow: hidden;
        border-radius: 0; width: 100%;
    }
    .cp-img-wrap img {
        display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
    }
    .cp-ribbon {
        position: absolute; top: 13px; right: -38px; width: 150px;
        text-align: center; transform: rotate(45deg);
        background: #e03131; color: #fff;
        font-size: .72rem; font-weight: 700; line-height: 1.9;
        box-shadow: 0 3px 8px rgba(0,0,0,.18);
    }
    /* 모달 외 배경: 블러 + 은은한 어둠 처리로 세련되게 */
    .modal-backdrop.show {
        opacity: 1;
        background-color: rgba(18, 20, 26, 0.38);
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
    }
</style>

<!-- 맞춤결제코드 입력 모달 -->
<div class="modal fade" id="customPayModal" tabindex="-1" aria-labelledby="customPayModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="post" th:action="@{/custom/lookup}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="customPayModalLabel">맞춤결제</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label fw-semibold">맞춤결제코드</label>
                    <input type="text" name="code" maxlength="4" inputmode="numeric"
                           th:value="${searchedCode}"
                           class="form-control form-control-lg text-center" placeholder="0000" required>
                    <div class="form-text">구매 시 안내받으신 <strong>전화번호 끝 4자리</strong>를 입력하세요.</div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary btn-lg">조회</button>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 무통장 입금 안내 모달 -->
<div class="modal fade" id="bankTransferModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">무통장 입금 안내</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex justify-content-between py-2 border-bottom">
                    <span class="text-muted">은행</span><span class="fw-bold">IBK 기업은행</span>
                </div>
                <div class="d-flex justify-content-between py-2 border-bottom">
                    <span class="text-muted">계좌번호</span><span class="fw-bold">542-030989-01-018</span>
                </div>
                <div class="d-flex justify-content-between py-2 border-bottom">
                    <span class="text-muted">예금주</span><span class="fw-bold">이성희 (라이트드론)</span>
                </div>
                <div class="d-flex justify-content-between py-2 border-bottom">
                    <span class="text-muted">입금금액</span>
                    <span class="fw-bold text-primary" id="bankAmount">0원</span>
                </div>
                <div class="alert alert-warning small mt-3 mb-0">
                    <i class="bi bi-exclamation-triangle me-1"></i>
                    입금자명을 <strong id="bankDepositor">구매자</strong>(으)로 입력해 주세요.
                    입금 확인 후 처리됩니다.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary btn-lg w-100" data-bs-dismiss="modal">확인</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>

<!-- 조회 전(아직 검색 안 함)일 때만 입력 모달 자동 오픈 — 검색 후엔 결과/안내만 표시 -->
<script th:if="${!searched}">
    document.addEventListener('DOMContentLoaded', function () {
        var el = document.getElementById('customPayModal');
        if (el) {
            var modal = new bootstrap.Modal(el);
            modal.show();
            el.addEventListener('shown.bs.modal', function () {
                var input = el.querySelector('input[name="code"]');
                if (input) input.focus();
            });
        }
    });
</script>

<!-- 토스페이먼츠 SDK -->
<script src="https://js.tosspayments.com/v1/payment"></script>
<script th:inline="javascript">
/*<![CDATA[*/
(function () {
    const TOSS_CLIENT_KEY = /*[[${tossClientKey}]]*/ '';
    const csrfToken = document.querySelector('input[name="_csrf"]');

    /* 무통장 입금 버튼 → 안내 모달에 금액·입금자명 채우기 */
    document.querySelectorAll('.bank-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const amount = parseInt(btn.dataset.amount || '0') || 0;
            const name = btn.dataset.name || '구매자';
            const amtEl = document.getElementById('bankAmount');
            const depEl = document.getElementById('bankDepositor');
            if (amtEl) amtEl.textContent = amount.toLocaleString('ko-KR') + '원';
            if (depEl) depEl.textContent = name;
        });
    });

    document.querySelectorAll('.cpay-btn').forEach(function (btn) {
        btn.addEventListener('click', async function () {
            const id = btn.dataset.id;
            btn.disabled = true;
            const original = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>처리 중...';

            try {
                const res = await fetch('/custom/prepare?id=' + encodeURIComponent(id), {
                    method: 'POST',
                    headers: csrfToken ? { 'X-CSRF-TOKEN': csrfToken.value } : {}
                });
                const data = await res.json();

                if (!data.success) {
                    alert(data.message || '결제 준비 중 오류가 발생했습니다.');
                    btn.disabled = false; btn.innerHTML = original;
                    return;
                }
                if (!TOSS_CLIENT_KEY) {
                    alert('결제 설정 오류입니다. 새로고침 후 다시 시도해주세요.');
                    btn.disabled = false; btn.innerHTML = original;
                    return;
                }

                const tossPayments = TossPayments(TOSS_CLIENT_KEY);
                await tossPayments.requestPayment('카드', {
                    amount: data.amount,
                    orderId: data.orderNumber,
                    orderName: data.orderName,
                    customerName: data.buyerName,
                    successUrl: window.location.origin + '/custom/success',
                    failUrl: window.location.origin + '/custom/fail',
                });
            } catch (err) {
                if (err && err.code !== 'USER_CANCEL') {
                    alert('결제 중 오류가 발생했습니다: ' + (err.message || ''));
                }
                btn.disabled = false; btn.innerHTML = original;
            }
        });
    });
})();
/*]]>*/
</script>
</body>
</html>
