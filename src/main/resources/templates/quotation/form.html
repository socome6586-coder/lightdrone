<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/fragments :: head('견적서 발행')}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">견적서 발행</h1>
        <p class="mb-0 opacity-75">기업·관공서 제출용 공식 견적서</p>
    </div>
</div>

<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">

                <!-- 장바구니 상품 요약 -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white py-3">
                        <span class="fw-bold"><i class="bi bi-cart3 me-2 text-primary"></i>견적 품목</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">품목명</th>
                                        <th class="text-center">수량</th>
                                        <th class="text-end">단가</th>
                                        <th class="text-end pe-3">공급가액</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${cartItems}">
                                        <td class="ps-3 align-middle">
                                            <div class="fw-semibold" th:text="${item.product.name}"></div>
                                            <small class="text-muted" th:text="${item.product.category}"></small>
                                        </td>
                                        <td class="text-center align-middle" th:text="${item.quantity}"></td>
                                        <td class="text-end align-middle"
                                            th:text="${#numbers.formatInteger(item.product.price, 0, 'COMMA') + '원'}"></td>
                                        <td class="text-end align-middle pe-3 fw-semibold"
                                            th:text="${#numbers.formatInteger(item.totalPrice, 0, 'COMMA') + '원'}"></td>
                                    </tr>
                                </tbody>
                                <tfoot class="table-light">
                                    <tr>
                                        <td colspan="3" class="text-end fw-bold ps-3">공급가액 합계</td>
                                        <td class="text-end fw-bold pe-3"
                                            th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA') + '원'}"></td>
                                    </tr>
                                    <tr>
                                        <td colspan="3" class="text-end text-muted ps-3">부가세 (10%)</td>
                                        <td class="text-end text-muted pe-3"
                                            th:text="${#numbers.formatInteger(totalPrice / 10, 0, 'COMMA') + '원'}"></td>
                                    </tr>
                                    <tr class="table-primary">
                                        <td colspan="3" class="text-end fw-bold fs-6 ps-3">합계금액 (VAT 포함)</td>
                                        <td class="text-end fw-bold fs-6 text-primary pe-3"
                                            th:text="${#numbers.formatInteger(totalPrice + totalPrice / 10, 0, 'COMMA') + '원'}"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 수신처 정보 입력 -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <span class="fw-bold"><i class="bi bi-building me-2 text-primary"></i>수신처 정보</span>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/quotation/preview}" method="post" th:object="${form}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <!-- 단일 상품 견적이면 productId/quantity 를 유지해 preview 에서도 같은 상품만 견적 -->
                            <input type="hidden" name="productId" th:if="${productId != null}" th:value="${productId}">
                            <input type="hidden" name="quantity" th:if="${productId != null}" th:value="${quantity}">

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">
                                        기업/기관명 <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" th:field="*{receiverCompany}" class="form-control"
                                           placeholder="예: (주)라이트드론" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">
                                        담당자명 <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" th:field="*{receiverName}" class="form-control"
                                           placeholder="홍길동" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">연락처</label>
                                    <input type="text" th:field="*{receiverPhone}"
                                           th:class="${#fields.hasErrors('receiverPhone')} ? 'form-control is-invalid' : 'form-control'"
                                           placeholder="010-0000-0000" maxlength="13">
                                    <div class="invalid-feedback" th:errors="*{receiverPhone}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">이메일</label>
                                    <input type="email" th:field="*{receiverEmail}" class="form-control"
                                           placeholder="example@company.com">
                                </div>
                                <!-- 납품 장소 주소 검색 -->
                                <div class="col-12">
                                    <label class="form-label fw-semibold">
                                        납품 장소 <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group mb-2">
                                        <input type="text" th:field="*{deliveryZipCode}" id="deliveryZipCode"
                                               class="form-control" placeholder="우편번호"
                                               style="max-width:160px;" readonly>
                                        <button type="button" class="btn btn-outline-secondary"
                                                onclick="searchDeliveryAddress()">
                                            <i class="bi bi-search me-1"></i>주소 찾기
                                        </button>
                                    </div>
                                    <input type="text" th:field="*{deliveryAddress}" id="deliveryAddress"
                                           th:class="${#fields.hasErrors('deliveryAddress')} ? 'form-control is-invalid mb-2' : 'form-control mb-2'"
                                           placeholder="기본 주소 (주소 찾기 버튼 이용)" readonly>
                                    <div class="invalid-feedback mb-2" th:errors="*{deliveryAddress}"></div>
                                    <div id="deliveryAddressMsg" class="text-danger small mb-2" style="display:none;">
                                        <i class="bi bi-exclamation-circle me-1"></i>납품 장소를 입력해주세요. 주소 찾기 버튼을 이용해 주세요.
                                    </div>
                                    <input type="text" th:field="*{deliveryAddressDetail}" id="deliveryAddressDetail"
                                           class="form-control"
                                           placeholder="상세 주소 (동/호수, 층 등 직접 입력)">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">견적 유효기간</label>
                                    <div class="input-group">
                                        <input type="number" th:field="*{validDays}" class="form-control"
                                               min="1" max="365">
                                        <span class="input-group-text">일</span>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">비고</label>
                                    <textarea th:field="*{note}" class="form-control" rows="3"
                                              placeholder="특이사항이 있으면 입력하세요"></textarea>
                                </div>

                                <div class="col-12 d-flex gap-2 pt-2">
                                    <button type="submit" class="btn btn-primary px-5" id="quotationSubmitBtn">
                                        <i class="bi bi-file-earmark-pdf me-2"></i>견적서 생성
                                    </button>
                                    <a th:href="@{/cart}" class="btn btn-outline-secondary px-4">취소</a>
                                </div>
                            </div>
                        </form>
                        <script>
                        document.querySelector('form[action*="quotation/preview"]').addEventListener('submit', function(e) {
                            const addr = document.getElementById('deliveryAddress').value.trim();
                            const msg  = document.getElementById('deliveryAddressMsg');
                            const input = document.getElementById('deliveryAddress');
                            if (!addr) {
                                e.preventDefault();
                                input.classList.add('is-invalid');
                                msg.style.display = 'block';
                                input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                return;
                            }
                            input.classList.remove('is-invalid');
                            msg.style.display = 'none';
                        });
                        </script>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<script>
let postcodeScriptPromise;

function ensurePostcodeLoaded() {
    if (window.daum && window.daum.Postcode) {
        return Promise.resolve();
    }
    if (postcodeScriptPromise) {
        return postcodeScriptPromise;
    }

    postcodeScriptPromise = new Promise(function(resolve, reject) {
        const script = document.createElement('script');
        script.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
        script.async = true;
        script.onload = function() {
            if (window.daum && window.daum.Postcode) {
                resolve();
            } else {
                reject(new Error('postcode-api-missing'));
            }
        };
        script.onerror = function() {
            reject(new Error('postcode-api-load-failed'));
        };
        document.head.appendChild(script);
    });

    return postcodeScriptPromise;
}

async function searchDeliveryAddress() {
    try {
        await ensurePostcodeLoaded();
        new daum.Postcode({
            oncomplete: function(data) {
                document.getElementById('deliveryZipCode').value = data.zonecode;
                document.getElementById('deliveryAddress').value = data.roadAddress || data.jibunAddress;
                document.getElementById('deliveryAddressDetail').value = '';
                document.getElementById('deliveryAddressDetail').focus();
            }
        }).open();
    } catch (error) {
        postcodeScriptPromise = null;
        alert('주소 검색 서비스를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
    }
}

(function() {
    function formatPhone(val) {
        var d = val.replace(/\D/g, '').slice(0, 11);
        if (d.length > 3) {
            var mid = (d.slice(0,3) === '010') ? 4 : 3;
            if (d.length > 3 + mid) return d.slice(0,3) + '-' + d.slice(3,3+mid) + '-' + d.slice(3+mid);
            return d.slice(0,3) + '-' + d.slice(3);
        }
        return d;
    }

    function applyPhoneInput(el) {
        if (!el) return;
        // 페이지 로드 시 기존 값 즉시 포맷 (서버 pre-fill 값이 하이픈 없는 경우 대비)
        if (el.value) el.value = formatPhone(el.value);
        el.addEventListener('beforeinput', function(e) {
            if (e.data && !/^\d+$/.test(e.data)) e.preventDefault();
        });
        el.addEventListener('input', function() {
            this.value = formatPhone(this.value);
        });
        el.addEventListener('compositionend', function() {
            this.value = formatPhone(this.value);
        });
    }

    applyPhoneInput(document.getElementById('receiverPhone'));
})();
</script>
<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
