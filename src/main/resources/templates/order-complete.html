<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/fragments :: head('주문 완료')}"></th:block>
    <style>
        .complete-icon { width:80px;height:80px;background:linear-gradient(135deg,#0d6efd,#0a58ca);
            border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto; }
        .info-row { display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid #f0f0f0; }
        .info-row:last-child { border-bottom:none; }
        .bank-box { background:#f0f8ff;border:1px solid #b6d4fe;border-radius:10px;padding:1.25rem; }
        .step-dot { width:28px;height:28px;border-radius:50%;background:#0d6efd;color:#fff;
            font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
        .step-line { width:2px;background:#dee2e6;flex-shrink:0;height:24px;margin:2px auto; }
    </style>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">주문 완료</h1>
    </div>
</div>

<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <!-- 완료 헤더 -->
                <div class="text-center mb-5">
                    <div class="complete-icon mb-3">
                        <i class="bi bi-check-lg text-white" style="font-size:2.2rem;"></i>
                    </div>
                    <h3 class="fw-bold mt-3">주문이 완료되었습니다!</h3>
                    <p class="text-muted">주문번호: <strong class="text-primary" th:text="${order.orderNumber}"></strong></p>
                </div>

                <!-- 주문 상품 -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold">
                        <i class="bi bi-box-seam me-2 text-primary"></i>주문 상품
                    </div>
                    <div class="card-body p-0">
                        <div th:each="item : ${order.items}"
                             class="d-flex align-items-center gap-3 px-4 py-3 border-bottom">
                            <div class="rounded bg-light flex-shrink-0 d-flex align-items-center justify-content-center"
                                 style="width:60px;height:60px;overflow:hidden;">
                                <img th:if="${item.product != null and item.product.imageUrl != null}"
                                     th:src="${item.product.imageUrl}" alt=""
                                     style="width:100%;height:100%;object-fit:cover;">
                                <i th:unless="${item.product != null and item.product.imageUrl != null}"
                                   class="bi bi-image text-muted fs-3"></i>
                            </div>
                            <div class="flex-grow-1">
                                <div class="fw-semibold small" th:text="${item.productName}"></div>
                                <div class="text-muted small"
                                     th:text="${#numbers.formatInteger(item.productPrice,0,'COMMA') + '원 × ' + item.quantity + '개'}"></div>
                            </div>
                            <div class="fw-bold text-primary small"
                                 th:text="${#numbers.formatInteger(item.totalPrice,0,'COMMA') + '원'}"></div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center px-4 py-2 border-top">
                            <span class="text-muted small">배송비</span>
                            <span class="small"
                                  th:text="${order.shippingFee != null ? #numbers.formatInteger(order.shippingFee,0,'COMMA') + '원' : '0원'}"></span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center px-4 py-3">
                            <span class="fw-bold">총 결제금액</span>
                            <span class="fw-bold fs-5 text-primary"
                                  th:text="${#numbers.formatInteger(order.totalPrice,0,'COMMA') + '원'}"></span>
                        </div>
                    </div>
                </div>

                <!-- 주문 정보 -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold">
                        <i class="bi bi-info-circle me-2 text-primary"></i>주문 정보
                    </div>
                    <div class="card-body">
                        <div class="info-row">
                            <span class="text-muted small">결제 수단</span>
                            <span class="small fw-semibold" th:text="${order.paymentMethod.label}"></span>
                        </div>
                        <div class="info-row">
                            <span class="text-muted small">구매자</span>
                            <span class="small fw-semibold"
                                  th:text="${order.buyerName + ' (' + order.buyerPhone + ')'}"></span>
                        </div>
                        <div class="info-row">
                            <span class="text-muted small">수령인</span>
                            <span class="small fw-semibold"
                                  th:text="${order.receiverName + ' (' + order.receiverPhone + ')'}"></span>
                        </div>
                        <div class="info-row">
                            <span class="text-muted small">배송지</span>
                            <span class="small fw-semibold text-end"
                                  th:text="${(order.zipCode != null ? '[' + order.zipCode + '] ' : '') + (order.address != null ? order.address : '') + (order.addressDetail != null ? ' ' + order.addressDetail : '')}"></span>
                        </div>
                        <div class="info-row" th:if="${order.deliveryMessage != null and !#strings.isEmpty(order.deliveryMessage)}">
                            <span class="text-muted small">배송 메시지</span>
                            <span class="small" th:text="${order.deliveryMessage}"></span>
                        </div>
                    </div>
                </div>

                <!-- 결제 안내 -->
                <div th:if="${order.paymentMethod.name() == 'BANK_TRANSFER'}" class="bank-box mb-4">
                    <h6 class="fw-bold mb-3"><i class="bi bi-bank me-2 text-primary"></i>무통장입금 안내</h6>
                    <div class="info-row">
                        <span class="text-muted small">은행</span>
                        <span class="fw-bold small">IBK 기업은행</span>
                    </div>
                    <div class="info-row">
                        <span class="text-muted small">계좌번호</span>
                        <span class="fw-bold small">542-030989-01-018</span>
                    </div>
                    <div class="info-row">
                        <span class="text-muted small">예금주</span>
                        <span class="fw-bold small">이성희 (라이트드론)</span>
                    </div>
                    <div class="info-row">
                        <span class="text-muted small">입금금액</span>
                        <span class="fw-bold small text-primary"
                              th:text="${#numbers.formatInteger(order.totalPrice,0,'COMMA') + '원'}"></span>
                    </div>
                    <p class="text-muted small mb-1 mt-2">
                        <i class="bi bi-exclamation-triangle me-1 text-warning"></i>
                        입금자명을 <strong th:text="${order.buyerName}"></strong>으로 입력해 주세요.
                        입금 확인 후 배송이 진행됩니다.
                    </p>
                    <p class="text-muted small mb-0">
                        <i class="bi bi-telephone me-1"></i>
                        문의: <a href="tel:010-3565-9741" class="text-primary fw-bold text-decoration-none">010-3565-9741</a>
                    </p>
                </div>
                <div th:if="${order.paymentMethod.name() == 'CARD'}" class="alert alert-info mb-4">
                    <i class="bi bi-credit-card me-2"></i>
                    담당자가 카드 결제 안내를 연락드릴 예정입니다.
                    문의: <strong>010-3565-9741</strong>
                </div>

                <!-- 배송 단계 안내 -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold">
                        <i class="bi bi-truck me-2 text-primary"></i>배송 진행 단계
                    </div>
                    <div class="card-body">
                        <div class="d-flex align-items-start gap-3" th:each="step, s : ${ {'결제 대기', '결제 확인', '상품 준비', '배송 중', '배송 완료'} }">
                            <div class="d-flex flex-column align-items-center">
                                <div class="step-dot" th:text="${s.count}"></div>
                                <div class="step-line" th:unless="${s.last}"></div>
                            </div>
                            <div class="pb-2 pt-1">
                                <div class="small fw-semibold" th:text="${step}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 버튼 -->
                <div class="d-flex gap-2 flex-wrap">
                    <a th:if="${order.member != null}" th:href="@{/order/my}" class="btn btn-primary flex-grow-1">
                        <i class="bi bi-list-ul me-1"></i>내 주문 확인
                    </a>
                    <a th:href="@{/products}"
                       th:class="${order.member == null} ? 'btn btn-primary flex-grow-1' : 'btn btn-outline-secondary flex-grow-1'">
                        <i class="bi bi-grid me-1"></i>쇼핑 계속하기
                    </a>
                </div>

            </div>
        </div>
    </div>
</section>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
