<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/fragments :: head('맞춤결제 완료')}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<section class="section-padding">
    <div class="container" style="max-width:560px;">
        <div class="card border-0 shadow-sm text-center">
            <div class="card-body p-5">
                <i class="bi bi-check-circle-fill text-success" style="font-size:3.5rem;"></i>
                <h3 class="fw-bold mt-3">결제가 완료되었습니다</h3>
                <p class="text-muted">맞춤결제가 정상적으로 처리되었습니다.</p>

                <div class="text-start mt-4 border-top pt-3">
                    <div class="d-flex justify-content-between py-1">
                        <span class="text-muted">상품명</span>
                        <span class="fw-semibold" th:text="${payment.name}">구매자</span>
                    </div>
                    <div class="d-flex justify-content-between py-1">
                        <span class="text-muted">배송방법</span>
                        <span th:text="${payment.deliveryMethod}">택배</span>
                    </div>
                    <div class="d-flex justify-content-between py-1">
                        <span class="text-muted">결제금액</span>
                        <span class="fw-bold text-primary"
                              th:text="${#numbers.formatInteger(payment.price, 0, 'COMMA') + '원'}">0원</span>
                    </div>
                    <div class="d-flex justify-content-between py-1">
                        <span class="text-muted">주문번호</span>
                        <span class="small" th:text="${payment.orderNumber}">CPAY-XXXX</span>
                    </div>
                </div>

                <a th:href="@{/}" class="btn btn-primary w-100 mt-4">
                    <i class="bi bi-house me-1"></i>홈으로
                </a>
            </div>
        </div>
    </div>
</section>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
