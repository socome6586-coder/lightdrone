<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - 잘못된 요청입니다</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8f9fa; }
        .error-code { font-size: 8rem; font-weight: 900; line-height: 1; color: #6c757d; opacity: .12; user-select: none; }
        .error-icon { font-size: 3.5rem; color: #6c757d; }
        .card { max-width: 480px; width: 100%; }
    </style>
</head>
<body>
<div class="card border-0 shadow-sm text-center p-5">
    <div class="error-code">400</div>
    <div class="error-icon my-3"><i class="bi bi-exclamation-circle"></i></div>
    <h3 class="fw-bold mb-2">잘못된 요청입니다</h3>
    <p class="text-muted mb-2" th:text="${errorMessage} ?: '요청을 처리할 수 없습니다.'"></p>
    <p class="text-muted small mb-4">이전 페이지로 돌아가거나 홈으로 이동해주세요.</p>
    <div class="d-flex gap-2 justify-content-center">
        <a href="/" class="btn btn-primary px-4">
            <i class="bi bi-house me-2"></i>홈으로
        </a>
        <button onclick="history.back()" class="btn btn-outline-secondary px-4">
            <i class="bi bi-arrow-left me-2"></i>이전 페이지
        </button>
    </div>
</div>
</body>
</html>
