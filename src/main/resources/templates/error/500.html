<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - 서버 오류가 발생했습니다</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f8f9fa; }
        .error-code { font-size: 8rem; font-weight: 900; line-height: 1; color: #fd7e14; opacity: .12; user-select: none; }
        .error-icon { font-size: 3.5rem; color: #fd7e14; }
        .card { max-width: 480px; width: 100%; }
    </style>
</head>
<body>
<div class="card border-0 shadow-sm text-center p-5">
    <div class="error-code">500</div>
    <div class="error-icon my-3"><i class="bi bi-exclamation-triangle"></i></div>
    <h3 class="fw-bold mb-2">서버 오류가 발생했습니다</h3>
    <p class="text-muted mb-4">일시적인 오류가 발생했습니다.<br>잠시 후 다시 시도해주세요.</p>
    <div class="d-flex gap-2 justify-content-center">
        <a href="/" class="btn btn-primary px-4">
            <i class="bi bi-house me-2"></i>홈으로
        </a>
        <a href="/inquiry" class="btn btn-outline-secondary px-4">
            <i class="bi bi-chat-dots me-2"></i>문의하기
        </a>
    </div>
</div>
</body>
</html>
