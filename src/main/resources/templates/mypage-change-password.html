<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('비밀번호 변경')}"></th:block>
    <style>
        .pw-strength-bar {
            height: 4px;
            border-radius: 2px;
            background: #e9ecef;
            overflow: hidden;
            margin-top: 6px;
        }
        .pw-strength-fill {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: width .3s, background .3s;
        }
    </style>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">비밀번호 변경</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white-50">홈</a></li>
                <li class="breadcrumb-item"><a th:href="@{/mypage}" class="text-white-50">마이페이지</a></li>
                <li class="breadcrumb-item active text-white">비밀번호 변경</li>
            </ol>
        </nav>
    </div>
</div>

<section class="section-padding">
    <div class="container">
        <div class="row g-4">

            <!-- 사이드바 -->
            <th:block th:replace="~{layout/fragments :: mypageSidebar('edit')}"></th:block>

            <!-- 메인 컨텐츠 -->
            <div class="col-md-9">

                <form th:action="@{/mypage/change-password}" method="post"
                      th:object="${passwordChangeDto}" novalidate id="changePwForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white fw-bold py-3">
                            <i class="bi bi-lock me-2 text-primary"></i>새 비밀번호 설정
                        </div>
                        <div class="card-body p-4">

                            <div th:if="${errorMsg}" class="alert alert-danger py-2 mb-4">
                                <i class="bi bi-exclamation-circle me-1"></i>
                                <span th:text="${errorMsg}"></span>
                            </div>

                            <div class="alert alert-light border py-2 mb-4 small">
                                <i class="bi bi-info-circle text-primary me-1"></i>
                                영문 대소문자·숫자·특수문자 중 <strong>2가지 이상</strong> 조합, <strong>10~16자</strong>.
                            </div>

                            <div class="row g-3">
                                <!-- 새 비밀번호 -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">새 비밀번호 <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{newPassword}"
                                               class="form-control border-end-0"
                                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                               id="newPwInput" placeholder="새 비밀번호"
                                               autocomplete="new-password">
                                        <button class="btn btn-outline-secondary border-start-0" type="button" id="toggleNewPw" tabindex="-1">
                                            <i class="bi bi-eye" id="eyeNew"></i>
                                        </button>
                                        <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                                    </div>
                                    <div class="pw-strength-bar mt-2">
                                        <div class="pw-strength-fill" id="pwStrengthFill"></div>
                                    </div>
                                    <div class="form-text" id="pwStrengthMsg"></div>
                                </div>

                                <!-- 새 비밀번호 확인 -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">새 비밀번호 확인 <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{newPasswordConfirm}"
                                               class="form-control border-end-0"
                                               id="newPwConfirmInput" placeholder="비밀번호 재입력"
                                               autocomplete="new-password">
                                        <button class="btn btn-outline-secondary border-start-0" type="button" id="toggleConfirm" tabindex="-1">
                                            <i class="bi bi-eye" id="eyeConfirm"></i>
                                        </button>
                                    </div>
                                    <div class="form-text" id="pwMatchMsg"></div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary flex-grow-1 btn-lg">
                            <i class="bi bi-check-circle me-2"></i>비밀번호 변경
                        </button>
                        <a th:href="@{/mypage/edit}" class="btn btn-outline-secondary flex-grow-1 btn-lg">
                            <i class="bi bi-x-circle me-2"></i>취소
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>
</section>

<script th:inline="javascript">
function bindToggle(btnId, inputId, iconId) {
    document.getElementById(btnId).addEventListener('click', function () {
        const inp  = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            inp.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });
}
bindToggle('toggleNewPw', 'newPwInput', 'eyeNew');
bindToggle('toggleConfirm', 'newPwConfirmInput', 'eyeConfirm');

const newPwInput        = document.getElementById('newPwInput');
const newPwConfirmInput = document.getElementById('newPwConfirmInput');
const pwStrengthFill    = document.getElementById('pwStrengthFill');
const pwStrengthMsg     = document.getElementById('pwStrengthMsg');
const pwMatchMsg        = document.getElementById('pwMatchMsg');

function checkStrength(pw) {
    if (!pw) return 0;
    let score = 0;
    if (/[a-z]/.test(pw)) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    if (pw.length >= 14) score++;
    return score;
}

newPwInput.addEventListener('input', function () {
    const pw = this.value;
    if (!pw) {
        pwStrengthFill.style.width = '0';
        pwStrengthFill.style.background = '';
        pwStrengthMsg.textContent = '';
        return;
    }
    const levels = [
        { w: '20%',  bg: '#dc3545', text: '매우 약함', cls: 'text-danger'  },
        { w: '40%',  bg: '#fd7e14', text: '약함',      cls: 'text-warning' },
        { w: '60%',  bg: '#ffc107', text: '보통',      cls: 'text-warning' },
        { w: '80%',  bg: '#20c997', text: '강함',      cls: 'text-success' },
        { w: '100%', bg: '#198754', text: '매우 강함', cls: 'text-success' },
    ];
    const lv = levels[Math.min(checkStrength(pw) - 1, 4)] || levels[0];
    pwStrengthFill.style.width = lv.w;
    pwStrengthFill.style.background = lv.bg;
    pwStrengthMsg.textContent = '강도: ' + lv.text;
    pwStrengthMsg.className = 'form-text ' + lv.cls;
    checkMatch();
});

newPwConfirmInput.addEventListener('input', checkMatch);

function checkMatch() {
    const pw1 = newPwInput.value;
    const pw2 = newPwConfirmInput.value;
    if (!pw2) { pwMatchMsg.textContent = ''; return; }
    if (pw1 === pw2) {
        pwMatchMsg.textContent = '✓ 비밀번호가 일치합니다.';
        pwMatchMsg.className = 'form-text text-success';
    } else {
        pwMatchMsg.textContent = '✗ 비밀번호가 일치하지 않습니다.';
        pwMatchMsg.className = 'form-text text-danger';
    }
}

document.getElementById('changePwForm').addEventListener('submit', function (e) {
    const pw1 = newPwInput.value;
    const pw2 = newPwConfirmInput.value;
    if (pw1 !== pw2) {
        e.preventDefault();
        alert('새 비밀번호와 확인 비밀번호가 일치하지 않습니다.');
        newPwConfirmInput.focus();
        return;
    }
    const pwRegex = /^(?:(?=.*[A-Z])(?=.*[a-z])|(?=.*[A-Z])(?=.*\d)|(?=.*[A-Z])(?=.*[^A-Za-z0-9])|(?=.*[a-z])(?=.*\d)|(?=.*[a-z])(?=.*[^A-Za-z0-9])|(?=.*\d)(?=.*[^A-Za-z0-9])).{10,16}$/;
    if (!pwRegex.test(pw1)) {
        e.preventDefault();
        alert('비밀번호는 10~16자이며 영문 대소문자/숫자/특수문자 중 2가지 이상 조합이어야 합니다.');
        newPwInput.focus();
    }
});
</script>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
