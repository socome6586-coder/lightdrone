<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('구매 후기 상세')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin-console.css}">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
</head>
<body class="admin-console-body">
<div class="admin-dashboard-shell">
<th:block th:replace="~{admin/fragments :: sidebar('inquiries')}"></th:block>
<main class="admin-dashboard-main">
<th:block th:replace="~{admin/fragments :: topbar('구매 후기 상세', '후기 원문과 관리자 답변, 공개 상태를 한 화면에서 관리합니다.')}"></th:block>
<div class="page-header"><div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">구매 후기 상세</h1>
    </div>
</div>
<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div th:if="${successMsg}" class="alert alert-success mb-3">
                    <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
                </div>

                <!-- 후기 내용 -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <span class="fw-bold" th:text="${review.title}">제목</span>
                        <div class="d-flex gap-2 align-items-center">
                            <span class="badge bg-warning text-dark" th:text="${review.category}">카테고리</span>
                            <span th:if="${review.visible}" class="badge bg-success">공개</span>
                            <span th:unless="${review.visible}" class="badge bg-secondary">숨김</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row g-2 mb-3 text-muted small">
                            <div class="col-md-4">
                                <i class="bi bi-person me-1"></i>
                                <span th:text="${review.member != null ? review.member.name : '정보없음'}"></span>
                            </div>
                            <div class="col-md-4">
                                <i class="bi bi-eye me-1"></i>조회 <span th:text="${review.viewCount}"></span>
                            </div>
                            <div class="col-md-4">
                                <i class="bi bi-calendar me-1"></i>
                                <span th:text="${#temporals.format(review.createdAt,'yyyy년 MM월 dd일 HH:mm')}"></span>
                            </div>
                        </div>
                        <hr>
                        <!-- 첨부 이미지 -->
                        <div th:if="${review.imageUrl != null}" class="mb-3 text-center">
                            <img th:src="${review.imageUrl}" alt="첨부 이미지"
                                 class="img-fluid rounded shadow-sm"
                                 style="max-width:100%;max-height:500px;">
                        </div>
                        <div style="white-space:pre-wrap;word-break:break-word;line-height:1.8;"
                             th:utext="${review.content}"></div>
                    </div>
                </div>

                <!-- 기존 답글 표시 -->
                <div th:if="${review.adminReply != null and !#strings.isEmpty(review.adminReply)}"
                     class="card border-0 shadow-sm border-start border-4 border-primary mb-4">
                    <div class="card-header bg-primary bg-opacity-10 py-3">
                        <span class="fw-bold text-primary">
                            <i class="bi bi-chat-dots-fill me-2"></i>등록된 답글
                        </span>
                        <span th:if="${review.adminReplyAt != null}" class="text-muted small ms-2">
                            (<span th:text="${#temporals.format(review.adminReplyAt,'yyyy.MM.dd HH:mm')}"></span>)
                        </span>
                    </div>
                    <div class="card-body">
                        <div style="line-height:1.8;" th:utext="${review.adminReply}"></div>
                    </div>
                </div>

                <!-- 답글 작성/수정 폼 -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white fw-bold py-3">
                        <i class="bi bi-reply-fill me-2 text-primary"></i>
                        <span th:text="${review.adminReply != null and !#strings.isEmpty(review.adminReply)} ? '답글 수정' : '답글 작성'"></span>
                    </div>
                    <div class="card-body">
                        <form id="reviewReplyForm" th:action="@{/admin/reviews/{id}/reply(id=${review.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <textarea id="reviewReply" name="reply" class="form-control"
                                          placeholder="답글 내용을 입력하세요. 비워두면 답글이 삭제됩니다."
                                          th:text="${review.adminReply}"></textarea>
                            </div>
                            <div class="d-flex gap-2 align-items-center">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-send me-1"></i>답글 저장
                                </button>
                                <a th:href="@{/admin/reviews}" class="btn btn-outline-secondary">
                                    목록
                                </a>
                            </div>
                        </form>
                        <!-- 공개/숨김 + 삭제 폼 별도 영역으로 분리 -->
                        <div class="d-flex gap-2 mt-3">
                            <form th:action="@{/admin/reviews/{id}/toggle-visible(id=${review.id})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit"
                                        th:class="${review.visible} ? 'btn btn-outline-secondary btn-sm' : 'btn btn-outline-success btn-sm'"
                                        th:text="${review.visible} ? '숨김 처리' : '공개 처리'">
                                </button>
                            </form>
                            <form th:action="@{/admin/reviews/{id}/delete(id=${review.id})}"
                                  method="post"
                                  onsubmit="return confirm('정말 삭제하시겠습니까?\n삭제된 후기는 복구할 수 없습니다.')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="from" value="list">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash me-1"></i>삭제
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
</main>
</div>
<th:block th:replace="~{admin/fragments :: admin-scripts}"></th:block>
<!-- jQuery 및 Summernote (Bootstrap JS 이후에 로드) -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/lang/summernote-ko-KR.min.js"></script>
<script>
$(function () {
    const csrfMeta = document.querySelector('meta[name="_csrf"]');
    const csrf = csrfMeta ? csrfMeta.content : '';
    $('#reviewReply').summernote({
        lang: 'ko-KR',
        dialogsInBody: true,
        height: 250,
        placeholder: '답글 내용을 입력하세요',
        toolbar: [
            ['font',     ['bold','italic','underline','strikethrough','clear']],
            ['fontname', ['fontname']],
            ['fontsize', ['fontsize']],
            ['color',    ['color']],
            ['para',     ['ul','ol','paragraph']],
            ['insert',   ['picture','link']],
            ['view',     ['undo','redo']],
        ],
        fontNames: ['Noto Sans KR','Arial','Arial Black','Courier New','Helvetica','Times New Roman'],
        fontSizes: ['10','11','12','13','14','16','18','20','24','28','36'],
        callbacks: {
            onImageUpload: function (files) {
                const editor = $('#reviewReply');
                for (let i = 0; i < files.length; i++) {
                    const fd = new FormData();
                    fd.append('file', files[i]);
                    fd.append('_csrf', csrf);
                    fetch('/api/admin/upload-image', {
                        method: 'POST',
                        headers: { 'X-CSRF-TOKEN': csrf },
                        credentials: 'same-origin',
                        body: fd
                    }).then(r => {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    }).then(d => {
                        if (d.url) editor.summernote('insertImage', d.url);
                        else throw new Error(d.error || '알 수 없는 오류');
                    }).catch(err => alert('이미지 업로드 실패: ' + err.message));
                }
            }
        }
    });
    /* 커스텀 Summernote 드롭다운 수동 처리 */
    $(document).on('click', '.note-toolbar .dropdown-toggle', function () {
        const $parent = $(this).closest('.note-btn-group, .btn-group');
        const $menu   = $parent.find('> .dropdown-menu, > .note-dropdown-menu').first();
        if (!$menu.length) return;
        const willOpen = !$menu.hasClass('show');
        $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        if (willOpen) $menu.addClass('show');
    });
    $(document).on('click', function (e) {
        if (!$(e.target).closest('.note-toolbar .note-btn-group, .note-toolbar .btn-group').length) {
            $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        }
    });

    /* 이미지 다이얼로그 multiple 허용 */
    $(document).on('shown.bs.modal', '.note-modal', function () {
        $(this).find('input[type="file"]').attr('multiple', true);
    });

    $('#reviewReplyForm').on('submit', function () {
        $('#reviewReply').val($('#reviewReply').summernote('code'));
    });
});
</script>
</body>
</html>
