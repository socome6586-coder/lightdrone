<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="sidebar(active)">
    <aside class="admin-dashboard-sidebar" id="adminSidebar">
        <div class="admin-brand">
            <div class="admin-brand-mark">
                <i class="bi bi-command"></i>
            </div>
            <div>
                <div class="admin-brand-title">LIGHT DRONE</div>
                <div class="admin-brand-subtitle">Admin Control Center</div>
            </div>
        </div>

        <div class="admin-nav-label">Dashboard</div>
        <nav class="admin-nav">
            <a th:href="@{/admin}" class="admin-nav-link" th:classappend="${active == 'dashboard'} ? ' active' : ''">
                <i class="bi bi-speedometer2"></i>
                <span>대시보드</span>
            </a>
            <a th:href="@{/admin/products}" class="admin-nav-link" th:classappend="${active == 'products'} ? ' active' : ''">
                <i class="bi bi-box-seam"></i>
                <span>상품 등록 / 관리</span>
            </a>
            <a th:href="@{/admin/orders}" class="admin-nav-link" th:classappend="${active == 'orders'} ? ' active' : ''">
                <i class="bi bi-bag-check"></i>
                <span>주문 / 배송 관리</span>
            </a>
            <a th:href="@{/admin/members}" class="admin-nav-link" th:classappend="${active == 'members'} ? ' active' : ''">
                <i class="bi bi-people"></i>
                <span>회원 관리</span>
            </a>
            <a th:href="@{/admin/inquiries}" class="admin-nav-link" th:classappend="${active == 'inquiries'} ? ' active' : ''">
                <i class="bi bi-chat-dots"></i>
                <span>문의 / 후기 관리</span>
            </a>
            <a th:href="@{/admin/notices}" class="admin-nav-link" th:classappend="${active == 'notices'} ? ' active' : ''">
                <i class="bi bi-megaphone"></i>
                <span>공지사항 관리</span>
            </a>
        </nav>

        <div class="admin-nav-label">Management</div>
        <nav class="admin-nav">
            <a th:href="@{/admin/manuals}" class="admin-nav-link" th:classappend="${active == 'manuals'} ? ' active' : ''">
                <i class="bi bi-journal-text"></i>
                <span>자료실 / 메뉴얼</span>
            </a>
            <a th:href="@{/admin/categories}" class="admin-nav-link" th:classappend="${active == 'categories'} ? ' active' : ''">
                <i class="bi bi-tags"></i>
                <span>카테고리 관리</span>
            </a>
            <a th:href="@{/admin/custom-payments}" class="admin-nav-link" th:classappend="${active == 'custom-payments'} ? ' active' : ''">
                <i class="bi bi-credit-card-2-front"></i>
                <span>맞춤결제 관리</span>
            </a>
            <a th:href="@{/admin/home-panels}" class="admin-nav-link" th:classappend="${active == 'home-panels'} ? ' active' : ''">
                <i class="bi bi-layout-wtf"></i>
                <span>메인 패널 관리</span>
            </a>
            <a th:href="@{/admin/popups}" class="admin-nav-link" th:classappend="${active == 'popups'} ? ' active' : ''">
                <i class="bi bi-window-stack"></i>
                <span>팝업 관리</span>
            </a>
            <a th:href="@{/admin/services}" class="admin-nav-link" th:classappend="${active == 'services'} ? ' active' : ''">
                <i class="bi bi-tools"></i>
                <span>서비스 관리</span>
            </a>
            <a th:href="@{/admin/sales}" class="admin-nav-link" th:classappend="${active == 'sales'} ? ' active' : ''">
                <i class="bi bi-graph-up-arrow"></i>
                <span>매출 통계</span>
            </a>
            <a th:href="@{/admin/activity-logs}" class="admin-nav-link" th:classappend="${active == 'activity-logs'} ? ' active' : ''">
                <i class="bi bi-clock-history"></i>
                <span>활동 로그</span>
            </a>
        </nav>

        <div class="admin-sidebar-card">
            <div class="title">빠른 작업</div>
            <div class="desc">
                상품 등록, 주문 확인, 공지 작성처럼 자주 여는 작업으로 바로 이동할 수 있습니다.
            </div>
            <div class="d-grid gap-2">
                <a th:href="@{/admin/products/new}" class="btn btn-light btn-sm fw-bold">상품 등록</a>
                <a th:href="@{/admin/orders}" class="btn btn-outline-light btn-sm fw-bold">주문 확인</a>
            </div>
        </div>
    </aside>
</th:block>

<th:block th:fragment="topbar(title, subtitle)">
    <div class="admin-topbar">
        <div class="admin-topbar-left">
            <button type="button" class="admin-mobile-menu-btn" id="adminSidebarToggle" aria-label="메뉴 열고 닫기" title="메뉴 열고 닫기">
                <i class="bi bi-list"></i>
            </button>
            <div>
                <div class="admin-page-eyebrow">Admin Workspace</div>
                <h1 class="admin-page-title" th:text="${title}">관리자 페이지</h1>
                <div class="admin-page-subtitle" th:text="${subtitle}">관리자 설명</div>
            </div>
        </div>

        <div class="admin-topbar-right">
            <a th:href="@{/}" class="admin-home-btn" title="메인 홈으로 이동" aria-label="메인 홈으로 이동">
                <i class="bi bi-house-door"></i>
            </a>

            <form class="admin-search" th:action="@{/admin/search}" method="get">
                <input type="text" name="q" placeholder="상품·주문·회원·문의 통합검색">
                <button type="submit" aria-label="검색">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <div class="admin-user-chip">
                <span class="admin-user-avatar">A</span>
                <div>
                    <div class="fw-bold small" sec:authentication="name">admin</div>
                    <div class="text-muted" style="font-size:.72rem;">System Administrator</div>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="admin-scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            var sidebarToggle = document.getElementById('adminSidebarToggle');
            var mobileQuery = window.matchMedia('(max-width: 1199.98px)');

            function closeMobileSidebar() {
                document.body.classList.remove('admin-sidebar-open');
            }

            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', function () {
                    if (mobileQuery.matches) {
                        document.body.classList.toggle('admin-sidebar-open');
                    } else {
                        document.body.classList.toggle('admin-sidebar-collapsed');
                    }
                });
            }

            var backdrop = document.createElement('div');
            backdrop.className = 'admin-sidebar-backdrop';
            backdrop.addEventListener('click', closeMobileSidebar);
            document.body.appendChild(backdrop);

            document.querySelectorAll('.admin-dashboard-sidebar .admin-nav-link').forEach(function (link) {
                link.addEventListener('click', function () {
                    if (mobileQuery.matches) {
                        closeMobileSidebar();
                    }
                });
            });
        })();
    </script>
</th:block>

</html>
