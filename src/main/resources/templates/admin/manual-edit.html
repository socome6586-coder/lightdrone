<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('자료실 수정')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin-console.css}">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
</head>
<body class="admin-console-body">
<div class="admin-dashboard-shell">
    <th:block th:replace="~{admin/fragments :: sidebar('manuals')}"></th:block>

    <main class="admin-dashboard-main">
        <th:block th:replace="~{admin/fragments :: topbar('자료실 수정', '등록된 자료 문서를 관리자 콘솔에서 편집합니다.')}"></th:block>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <form th:action="@{/admin/manuals/{id}/edit(id=${manual.id})}" method="post" th:object="${manualDto}" id="manualEditForm">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div class="row g-3 mb-3">
                                    <div class="col-md-8">
                                        <label class="form-label fw-semibold">제목</label>
                                        <input type="text" th:field="*{title}" class="form-control"
                                               th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
                                               placeholder="자료실 제목을 입력해 주세요.">
                                        <div class="invalid-feedback" th:errors="*{title}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">카테고리</label>
                                        <select th:field="*{category}" class="form-select">
                                            <option value="">-- 선택 --</option>
                                            <option value="작업기">작업기</option>
                                            <option value="교육자료">교육자료</option>
                                            <option value="기타">기타</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">내용</label>
                                    <textarea th:field="*{content}" class="form-control" rows="12"
                                              th:classappend="${#fields.hasErrors('content')} ? ' is-invalid'"
                                              placeholder="자료실 내용을 입력해 주세요."></textarea>
                                    <div class="invalid-feedback" th:errors="*{content}"></div>
                                </div>

                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" th:field="*{pinned}" id="manualPinnedCheck">
                                    <label class="form-check-label" for="manualPinnedCheck">상단 고정</label>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-save me-1"></i>저장
                                    </button>
                                    <a th:href="@{/admin/manuals}" class="btn btn-outline-secondary">취소</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{admin/fragments :: admin-scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/lang/summernote-ko-KR.min.js"></script>
<script>
$(function () {
    const csrfMeta = document.querySelector('meta[name="_csrf"]');
    const csrf = csrfMeta ? csrfMeta.content : '';

    $('#content').summernote({
        lang: 'ko-KR',
        dialogsInBody: true,
        height: 320,
        placeholder: '자료실 내용을 입력해 주세요.',
        toolbar: [
            ['font', ['bold','italic','underline','strikethrough','clear']],
            ['fontname', ['fontname']],
            ['fontsize', ['fontsize']],
            ['color', ['color']],
            ['para', ['ul','ol','paragraph']],
            ['insert', ['picture','link']],
            ['view', ['undo','redo','fullscreen','codeview']]
        ],
        fontNames: ['Noto Sans KR','Arial','Arial Black','Courier New','Helvetica','Times New Roman'],
        fontSizes: ['10','11','12','13','14','16','18','20','24','28','36'],
        callbacks: {
            onImageUpload: function (files) {
                const editor = $('#content');
                for (let i = 0; i < files.length; i++) {
                    const fd = new FormData();
                    fd.append('file', files[i]);
                    fd.append('_csrf', csrf);
                    fetch('/api/admin/upload-image', {
                        method: 'POST',
                        headers: { 'X-CSRF-TOKEN': csrf },
                        credentials: 'same-origin',
                        body: fd
                    }).then(r => {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    }).then(d => {
                        if (d.url) editor.summernote('insertImage', d.url);
                        else throw new Error(d.error || '업로드 오류');
                    }).catch(err => alert('이미지 업로드 실패: ' + err.message));
                }
            }
        }
    });

    $('#manualEditForm').on('submit', function () {
        $('#content').val($('#content').summernote('code'));
    });
});
</script>
</body>
</html>
