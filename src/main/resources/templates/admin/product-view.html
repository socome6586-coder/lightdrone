<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/fragments :: head('제품 상세')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin-console.css}">
</head>
<body class="admin-console-body">
<div class="admin-dashboard-shell">
    <th:block th:replace="~{admin/fragments :: sidebar('products')}"></th:block>

    <main class="admin-dashboard-main">
        <th:block th:replace="~{admin/fragments :: topbar('제품 상세', '등록된 제품의 정보와 노출 상태, 내용 이미지를 확인합니다.')}"></th:block>

        <div class="container">
        <div class="row justify-content-center">
            <div class="col-12">

                <!-- 액션 버튼 -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>목록으로
                    </a>
                    <div class="d-flex gap-2">
                        <a th:href="@{/products/{id}(id=${product.id})}" target="_blank"
                           class="btn btn-sm btn-primary">
                            <i class="bi bi-box-arrow-up-right me-1"></i>제품상세보기
                        </a>
                        <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil me-1"></i>수정
                        </a>
                        <form th:action="@{/admin/products/{id}/delete(id=${product.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('제품을 삭제하시겠습니까?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>삭제
                            </button>
                        </form>
                    </div>
                </div>

                <!-- 메인 카드 -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white py-3">
                        <span class="fw-bold fs-6">
                            <i class="bi bi-box-seam me-2 text-primary"></i>제품 정보
                        </span>
                    </div>
                    <div class="card-body p-4">

                        <div class="row g-4">
                            <!-- 대표 이미지 -->
                            <div class="col-md-4 text-center">
                                <div class="border rounded p-3 bg-light d-flex align-items-center justify-content-center"
                                     style="min-height:220px;">
                                    <img th:if="${product.imageUrl != null}"
                                         th:src="${product.imageUrl}" alt="제품 이미지"
                                         class="img-fluid rounded"
                                         style="max-height:200px;object-fit:contain;">
                                    <div th:unless="${product.imageUrl != null}">
                                        <i class="bi bi-image text-muted" style="font-size:4rem;"></i>
                                        <p class="text-muted small mt-2 mb-0">이미지 없음</p>
                                    </div>
                                </div>
                            </div>

                            <!-- 기본 정보 -->
                            <div class="col-md-8">
                                <h5 class="fw-bold mb-3" th:text="${product.name}"></h5>

                                <div class="row g-2 small">
                                    <div class="col-5 col-md-4 text-muted fw-semibold">카테고리</div>
                                    <div class="col-7 col-md-8">
                                        <span class="badge bg-light text-secondary border"
                                              th:text="${product.category}"></span>
                                        <span th:if="${product.subcategory != null and !#strings.isEmpty(product.subcategory)}"
                                              class="badge bg-info text-white ms-1"
                                              th:text="${product.subcategory}"></span>
                                    </div>

                                    <div class="col-5 col-md-4 text-muted fw-semibold">가격</div>
                                    <div class="col-7 col-md-8">
                                        <span th:if="${product.priceOnRequest}" class="fw-bold text-info">가격 문의</span>
                                        <span th:unless="${product.priceOnRequest}"
                                              class="fw-bold text-primary"
                                              th:text="${#numbers.formatInteger(product.price, 0, 'COMMA') + '원'}"></span>
                                    </div>

                                    <div class="col-5 col-md-4 text-muted fw-semibold">재고</div>
                                    <div class="col-7 col-md-8" th:text="${product.stock + '개'}"></div>

                                    <div class="col-5 col-md-4 text-muted fw-semibold">노출 상태</div>
                                    <div class="col-7 col-md-8">
                                        <span class="badge rounded-pill"
                                              th:classappend="${product.available} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${product.available} ? '노출 중' : '숨김'"></span>
                                    </div>

                                    <div class="col-5 col-md-4 text-muted fw-semibold">정렬 순서</div>
                                    <div class="col-7 col-md-8" th:text="${product.sortOrder}"></div>

                                    <div th:if="${product.description != null and !#strings.isEmpty(product.description)}"
                                         class="col-12 mt-2">
                                        <div class="text-muted fw-semibold mb-1">제품 설명</div>
                                        <div class="bg-light rounded p-3 small"
                                             style="white-space:pre-wrap;word-break:break-word;"
                                             th:utext="${product.description}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- 내용 이미지 -->
                <div th:if="${product.contentImages != null and !#lists.isEmpty(product.contentImages)}"
                     class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <span class="fw-bold fs-6">
                            <i class="bi bi-images me-2 text-primary"></i>
                            내용 이미지 (<span th:text="${#lists.size(product.contentImages)}">0</span>장)
                        </span>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div th:each="img : ${product.contentImages}" class="col-6 col-md-4 col-lg-3">
                                <img th:src="${img}" alt=""
                                     class="img-fluid rounded border"
                                     style="width:100%;height:140px;object-fit:cover;">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    </main>
</div>
</body>
</html>
