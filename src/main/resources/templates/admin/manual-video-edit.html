<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('자료실 영상 수정')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin-console.css}">
</head>
<body class="admin-console-body">
<div class="admin-dashboard-shell">
    <th:block th:replace="~{admin/fragments :: sidebar('manuals')}"></th:block>

    <main class="admin-dashboard-main">
        <th:block th:replace="~{admin/fragments :: topbar('자료실 영상 수정', '자료실 상단에 노출되는 유튜브 영상을 수정합니다.')}"></th:block>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <form th:action="@{/admin/manual-videos/{id}/edit(id=${video.id})}" method="post"
                                  th:object="${supportVideoDto}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div class="row g-3 mb-3">
                                    <div class="col-md-8">
                                        <label class="form-label fw-semibold">영상 제목</label>
                                        <input type="text" th:field="*{title}" class="form-control"
                                               th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
                                               placeholder="영상 제목을 입력해 주세요.">
                                        <div class="invalid-feedback" th:errors="*{title}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">카테고리</label>
                                        <select th:field="*{category}" class="form-select">
                                            <option value="">전체</option>
                                            <option value="농업용">농업용</option>
                                            <option value="교육용">교육용</option>
                                            <option value="기타">기타</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">유튜브 링크</label>
                                    <input type="text" th:field="*{youtubeUrl}" class="form-control"
                                           th:classappend="${#fields.hasErrors('youtubeUrl')} ? ' is-invalid'"
                                           placeholder="https://www.youtube.com/watch?v=...">
                                    <div class="invalid-feedback" th:errors="*{youtubeUrl}"></div>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">정렬 순서</label>
                                        <input type="number" min="0" th:field="*{sortOrder}" class="form-control"
                                               th:classappend="${#fields.hasErrors('sortOrder')} ? ' is-invalid'">
                                        <div class="invalid-feedback" th:errors="*{sortOrder}"></div>
                                    </div>
                                    <div class="col-md-4 d-flex align-items-end">
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" th:field="*{visible}" id="videoVisibleCheck">
                                            <label class="form-check-label" for="videoVisibleCheck">노출</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-save me-1"></i>저장
                                    </button>
                                    <a th:href="@{/admin/manuals}" class="btn btn-outline-secondary">취소</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{admin/fragments :: admin-scripts}"></th:block>
</body>
</html>
