<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('Q&A 상세')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin-console.css}">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
</head>
<body class="admin-console-body">
<div class="admin-dashboard-shell">
    <th:block th:replace="~{admin/fragments :: sidebar('inquiries')}"></th:block>

    <main class="admin-dashboard-main">
        <th:block th:replace="~{admin/fragments :: topbar('Q&A 상세', '질문 원문과 답변 상태를 관리자 콘솔 안에서 처리합니다.')}"></th:block>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div th:if="${successMsg}" class="alert alert-success mb-3">
                        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
                    </div>

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                            <span class="fw-bold" th:text="${qna.title}">제목</span>
                            <span class="badge"
                                  th:classappend="${qna.answered} ? 'bg-success' : 'bg-warning text-dark'"
                                  th:text="${qna.answered} ? '답변완료' : '미답변'"></span>
                        </div>
                        <div class="card-body">
                            <div class="row g-2 mb-3 text-muted small">
                                <div class="col-md-4"><i class="bi bi-person me-1"></i><span th:text="${qna.member != null ? qna.member.name : '회원정보 없음'}"></span></div>
                                <div class="col-md-4"><i class="bi bi-eye me-1"></i>조회 <span th:text="${qna.viewCount}"></span></div>
                                <div class="col-md-4"><i class="bi bi-calendar me-1"></i><span th:text="${#temporals.format(qna.createdAt,'yyyy년 MM월 dd일 HH:mm')}"></span></div>
                            </div>
                            <hr>
                            <div th:if="${!#lists.isEmpty(qna.allImageUrls)}" class="mb-3 text-center">
                                <img th:each="img : ${qna.allImageUrls}" th:src="${img}" alt="첨부 이미지"
                                     class="img-fluid rounded shadow-sm mb-3 d-block mx-auto"
                                     style="max-width:100%;max-height:500px;">
                            </div>
                            <div style="word-break:break-word;line-height:1.8;" th:utext="${qna.content}"></div>
                        </div>
                    </div>

                    <div th:if="${qna.answered}" class="card border-0 shadow-sm border-start border-4 border-primary mb-4">
                        <div class="card-header bg-primary bg-opacity-10 py-3">
                            <span class="fw-bold text-primary">
                                <i class="bi bi-chat-dots-fill me-2"></i>등록된 답변
                            </span>
                        </div>
                        <div class="card-body">
                            <div style="line-height:1.8;" th:utext="${qna.answer}"></div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white fw-bold py-3">
                            <i class="bi bi-reply-fill me-2 text-primary"></i>
                            <span th:text="${qna.answered} ? '답변 수정' : '답변 작성'"></span>
                        </div>
                        <div class="card-body">
                            <form id="qnaAnswerForm" th:action="@{/admin/qna/{id}/answer(id=${qna.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <div class="mb-3">
                                    <textarea id="qnaAnswer" name="answer" class="form-control"
                                              placeholder="답변 내용을 입력해 주세요."
                                              th:text="${qna.answer}"></textarea>
                                </div>
                                <div class="d-flex gap-2 align-items-center">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-send me-1"></i>답변 저장
                                    </button>
                                    <a th:href="@{/admin/inquiries(tab='qna')}" class="btn btn-outline-secondary">목록</a>
                                </div>
                            </form>

                            <form th:action="@{/admin/qna/{id}/delete(id=${qna.id})}"
                                  method="post" class="mt-3"
                                  onsubmit="return confirm('정말 삭제하시겠습니까?\n삭제된 게시글은 복구할 수 없습니다.')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash me-1"></i>삭제
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{admin/fragments :: admin-scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/lang/summernote-ko-KR.min.js"></script>
<script>
$(function () {
    const csrfMeta = document.querySelector('meta[name="_csrf"]');
    const csrf = csrfMeta ? csrfMeta.content : '';
    $('#qnaAnswer').summernote({
        lang: 'ko-KR',
        dialogsInBody: true,
        height: 250,
        placeholder: '답변 내용을 입력해 주세요.',
        toolbar: [
            ['font', ['bold','italic','underline','strikethrough','clear']],
            ['fontname', ['fontname']],
            ['fontsize', ['fontsize']],
            ['color', ['color']],
            ['para', ['ul','ol','paragraph']],
            ['insert', ['picture','link']],
            ['view', ['undo','redo']]
        ],
        fontNames: ['Noto Sans KR','Arial','Arial Black','Courier New','Helvetica','Times New Roman'],
        fontSizes: ['10','11','12','13','14','16','18','20','24','28','36'],
        callbacks: {
            onImageUpload: function (files) {
                const editor = $('#qnaAnswer');
                for (let i = 0; i < files.length; i++) {
                    const fd = new FormData();
                    fd.append('file', files[i]);
                    fd.append('_csrf', csrf);
                    fetch('/api/admin/upload-image', {
                        method: 'POST',
                        headers: { 'X-CSRF-TOKEN': csrf },
                        credentials: 'same-origin',
                        body: fd
                    }).then(r => {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    }).then(d => {
                        if (d.url) editor.summernote('insertImage', d.url);
                        else throw new Error(d.error || '업로드 오류');
                    }).catch(err => alert('이미지 업로드 실패: ' + err.message));
                }
            }
        }
    });

    $(document).on('click', '.note-toolbar .dropdown-toggle', function () {
        const $parent = $(this).closest('.note-btn-group, .btn-group');
        const $menu = $parent.find('> .dropdown-menu, > .note-dropdown-menu').first();
        if (!$menu.length) return;
        const willOpen = !$menu.hasClass('show');
        $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        if (willOpen) $menu.addClass('show');
    });

    $(document).on('click', function (e) {
        if (!$(e.target).closest('.note-toolbar .note-btn-group, .note-toolbar .btn-group').length) {
            $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        }
    });

    $(document).on('shown.bs.modal', '.note-modal', function () {
        $(this).find('input[type="file"]').attr('multiple', true);
    });

    $('#qnaAnswerForm').on('submit', function () {
        $('#qnaAnswer').val($('#qnaAnswer').summernote('code'));
    });
});
</script>
</body>
</html>
