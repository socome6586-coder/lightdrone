<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('문의 상세')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin-console.css}">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
</head>
<body class="admin-console-body">
<div class="admin-dashboard-shell">
    <th:block th:replace="~{admin/fragments :: sidebar('inquiries')}"></th:block>

    <main class="admin-dashboard-main">
        <th:block th:replace="~{admin/fragments :: topbar('문의 상세', '견적 문의 확인과 답변, SMS 발송을 같은 관리자 화면에서 처리합니다.')}"></th:block>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div th:if="${successMsg}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span></div>

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <span class="fw-bold" th:text="${inquiry.subject}">제목</span>
                            <span class="badge" th:classappend="${inquiry.answered} ? 'bg-success' : 'bg-warning text-dark'"
                                  th:text="${inquiry.answered} ? '답변완료' : '미답변'"></span>
                        </div>
                        <div class="card-body">
                            <div class="row g-2 mb-3 text-muted small">
                                <div class="col-md-4"><i class="bi bi-person me-1"></i><span th:text="${inquiry.name}"></span></div>
                                <div class="col-md-4"><i class="bi bi-envelope me-1"></i><span th:text="${inquiry.email}"></span></div>
                                <div class="col-md-4"><i class="bi bi-telephone me-1"></i><span th:text="${inquiry.phone ?: '-'}"></span></div>
                                <div class="col-12"><i class="bi bi-calendar me-1"></i>
                                    <span th:text="${#temporals.format(inquiry.createdAt,'yyyy년 MM월 dd일 HH:mm')}"></span>
                                </div>
                            </div>
                            <hr>
                            <div class="inquiry-content" th:text="${inquiry.content}"></div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white fw-bold">
                            <i class="bi bi-reply-fill me-2 text-primary"></i>답변
                        </div>
                        <div class="card-body">
                            <div th:if="${inquiry.answered}" class="alert alert-info mb-3">
                                <div class="mb-0" th:utext="${inquiry.answer}"></div>
                            </div>

                            <form id="inquiryAnswerForm" th:action="@{/admin/inquiries/{id}/answer(id=${inquiry.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold" th:text="${inquiry.answered} ? '답변 수정' : '답변 작성'"></label>
                                    <textarea id="inquiryAnswer" name="answer" class="form-control"
                                              th:text="${inquiry.answer}" placeholder="답변 내용을 입력해 주세요."></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-phone me-1"></i>SMS 발송 번호
                                        <small class="text-muted fw-normal ms-1">비워두면 SMS는 발송되지 않습니다.</small>
                                    </label>
                                    <input type="tel" name="smsPhone" class="form-control"
                                           th:value="${inquirySmsPhone}"
                                           placeholder="010-0000-0000">
                                    <div class="form-text text-warning" th:if="${#strings.isEmpty(inquirySmsPhone)}">
                                        <i class="bi bi-exclamation-triangle me-1"></i>등록된 연락처가 없으면 번호를 직접 입력해야 SMS가 발송됩니다.
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-send me-1"></i>답변 저장
                                    </button>
                                    <a th:href="@{/admin/inquiries}" class="btn btn-outline-secondary">목록</a>
                                </div>
                            </form>

                            <form th:action="@{/admin/inquiries/{id}/delete(id=${inquiry.id})}"
                                  method="post" class="mt-3"
                                  onsubmit="return confirm('정말 삭제하시겠습니까?\n삭제된 문의는 복구할 수 없습니다.')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-danger">
                                    <i class="bi bi-trash me-1"></i>삭제
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{admin/fragments :: admin-scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/lang/summernote-ko-KR.min.js"></script>
<script>
$(function () {
    const csrfMeta = document.querySelector('meta[name="_csrf"]');
    const csrf = csrfMeta ? csrfMeta.content : '';
    $('#inquiryAnswer').summernote({
        lang: 'ko-KR',
        dialogsInBody: true,
        height: 250,
        placeholder: '답변 내용을 입력해 주세요.',
        toolbar: [
            ['font', ['bold','italic','underline','strikethrough','clear']],
            ['fontname', ['fontname']],
            ['fontsize', ['fontsize']],
            ['color', ['color']],
            ['para', ['ul','ol','paragraph']],
            ['insert', ['picture','link']],
            ['view', ['undo','redo']]
        ],
        fontNames: ['Noto Sans KR','Arial','Arial Black','Courier New','Helvetica','Times New Roman'],
        fontSizes: ['10','11','12','13','14','16','18','20','24','28','36'],
        callbacks: {
            onImageUpload: function (files) {
                const editor = $('#inquiryAnswer');
                for (let i = 0; i < files.length; i++) {
                    const fd = new FormData();
                    fd.append('file', files[i]);
                    fd.append('_csrf', csrf);
                    fetch('/api/admin/upload-image', {
                        method: 'POST',
                        headers: { 'X-CSRF-TOKEN': csrf },
                        credentials: 'same-origin',
                        body: fd
                    }).then(r => {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    }).then(d => {
                        if (d.url) editor.summernote('insertImage', d.url);
                        else throw new Error(d.error || '업로드 오류');
                    }).catch(err => alert('이미지 업로드 실패: ' + err.message));
                }
            }
        }
    });

    $(document).on('click', '.note-toolbar .dropdown-toggle', function () {
        const $parent = $(this).closest('.note-btn-group, .btn-group');
        const $menu = $parent.find('> .dropdown-menu, > .note-dropdown-menu').first();
        if (!$menu.length) return;
        const willOpen = !$menu.hasClass('show');
        $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        if (willOpen) $menu.addClass('show');
    });

    $(document).on('click', function (e) {
        if (!$(e.target).closest('.note-toolbar .note-btn-group, .note-toolbar .btn-group').length) {
            $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        }
    });

    $(document).on('shown.bs.modal', '.note-modal', function () {
        $(this).find('input[type="file"]').attr('multiple', true);
    });

    $('#inquiryAnswerForm').on('submit', function () {
        $('#inquiryAnswer').val($('#inquiryAnswer').summernote('code'));
    });
});
</script>
</body>
</html>
