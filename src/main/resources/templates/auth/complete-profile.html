<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('추가정보 입력')}"></th:block>
</head>
<body>
<script>document.body.style.overflow = '';</script>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>
<div class="auth-section">
        <div class="auth-card card border-0 shadow-lg p-4">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="text-decoration-none">
                    <h3 class="text-primary fw-bold"><i class="bi bi-drone me-2"></i>LIGHT DRONE</h3>
                </a>
                <p class="text-muted small mb-1">
                    <span th:text="${memberName}">회원</span>님, 환영합니다!
                </p>
                <p class="text-muted small">원활한 서비스 이용을 위해 이메일 주소를 입력해주세요.</p>
            </div>

            <div th:if="${errorMsg}" class="alert alert-danger py-2 small">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <form th:action="@{/auth/complete-profile}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-4">
                    <label class="form-label fw-semibold">이메일</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control"
                               placeholder="example@email.com"
                               th:value="${email}" required autofocus>
                    </div>
                    <div class="form-text">
                        주문·견적 안내 등 서비스 알림을 받을 이메일 주소입니다.
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg mb-2">
                    <i class="bi bi-check-circle me-2"></i>입력 완료
                </button>
            </form>
        </div>
    </div>
<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
