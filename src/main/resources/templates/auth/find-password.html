<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/fragments :: head('비밀번호 찾기')}"></th:block>
    <style>
        .pw-strength-bar { height:4px; border-radius:2px; background:#e9ecef; overflow:hidden; margin-top:6px; }
        .pw-strength-fill { height:100%; width:0; border-radius:2px; transition:width .3s, background .3s; }
    </style>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="auth-section d-flex align-items-center justify-content-center py-5 bg-light">
    <div class="auth-card card border-0 shadow-lg p-4" style="width:100%;max-width:480px;">

        <!-- 헤더 -->
        <div class="text-center mb-4">
            <div class="bg-warning text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                 style="width:56px;height:56px;font-size:1.5rem;">
                <i class="bi bi-key-fill"></i>
            </div>
            <h5 class="fw-bold mb-1">비밀번호 찾기</h5>
            <p class="text-muted small">본인 확인 후 새 비밀번호를 설정할 수 있습니다.</p>
        </div>

        <!-- ════ STEP 1.5: 휴대폰 OTP 인증 ════ -->
        <div th:if="${step == 'phone_verify'}">
            <div class="alert alert-info py-2 small mb-4">
                <i class="bi bi-phone me-2"></i>
                등록된 휴대폰
                <strong th:text="${maskedPhone}"></strong>
                으로 인증번호를 발송했습니다.<br>
                <span class="text-muted">3분 이내에 6자리 숫자를 입력해주세요.</span>
            </div>

            <div th:if="${otpError}" class="alert alert-danger py-2 small mb-3">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span th:text="${otpError}"></span>
            </div>

            <form th:action="@{/auth/find-password/verify-otp}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-4">
                    <label class="form-label fw-semibold">인증번호 6자리</label>
                    <input type="text" name="otp"
                           class="form-control form-control-lg text-center fw-bold letter-spacing-3"
                           placeholder="인증번호 입력"
                           maxlength="6" pattern="[0-9]{6}" inputmode="numeric"
                           autocomplete="one-time-code" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-shield-check me-2"></i>인증 확인
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/auth/find-password}" class="text-muted small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i>처음부터 다시 시도
                </a>
            </div>
        </div>

        <!-- ════ STEP 2: 새 비밀번호 설정 (OTP 인증 완료 후) ════ -->
        <div th:if="${step == 'reset'}">
            <div class="alert alert-success py-2 small mb-4">
                <i class="bi bi-check-circle me-1"></i>
                본인 확인이 완료되었습니다. 새 비밀번호를 설정해주세요.
            </div>

            <div th:if="${pwMatchError}" class="alert alert-danger py-2 small mb-3">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span th:text="${pwMatchError}"></span>
            </div>
            <div th:if="${pwPolicyError}" class="alert alert-danger py-2 small mb-3">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span th:text="${pwPolicyError}"></span>
            </div>

            <form th:action="@{/auth/find-password/reset}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">새 비밀번호</label>
                    <div class="input-group">
                        <input type="password" name="newPassword" id="newPwInput"
                               class="form-control border-end-0"
                               placeholder="10~16자, 2가지 이상 조합" required
                               autocomplete="new-password">
                        <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePw1" tabindex="-1">
                            <i class="bi bi-eye" id="eyeIcon1"></i>
                        </button>
                    </div>
                    <div class="pw-strength-bar"><div class="pw-strength-fill" id="pwFill"></div></div>
                    <div class="form-text" id="pwStrengthMsg"></div>
                    <div class="form-text text-muted">영문 대소문자/숫자/특수문자 중 2가지 이상, 10~16자</div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">새 비밀번호 확인</label>
                    <div class="input-group">
                        <input type="password" name="newPasswordConfirm" id="newPwConfirmInput"
                               class="form-control border-end-0"
                               placeholder="비밀번호 재입력" required
                               autocomplete="new-password">
                        <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePw2" tabindex="-1">
                            <i class="bi bi-eye" id="eyeIcon2"></i>
                        </button>
                    </div>
                    <div class="form-text" id="pwMatchMsg"></div>
                </div>

                <button type="submit" class="btn btn-warning w-100 btn-lg text-white fw-bold">
                    <i class="bi bi-shield-check me-2"></i>비밀번호 변경 완료
                </button>
            </form>
        </div>

        <!-- ════ STEP 1: 본인 확인 ════ -->
        <div th:if="${step == null or (step != 'reset' and step != 'phone_verify')}">

            <!-- 오류 메시지 -->
            <div th:if="${errorMsg}" class="alert alert-danger py-2 small mb-3">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <!-- 탭 -->
            <ul class="nav nav-pills nav-fill mb-4">
                <li class="nav-item">
                    <button class="nav-link"
                            th:classappend="${method == null or method == 'email'} ? 'active'"
                            onclick="switchTab('email')">
                        <i class="bi bi-envelope me-1"></i>이메일로 찾기
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link"
                            th:classappend="${method == 'phone'} ? 'active'"
                            onclick="switchTab('phone')">
                        <i class="bi bi-phone me-1"></i>휴대폰으로 찾기
                    </button>
                </li>
            </ul>

            <!-- 이메일로 찾기 폼 -->
            <form id="form-email"
                  th:style="${method == 'phone'} ? 'display:none;' : ''"
                  th:action="@{/auth/find-password/verify}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="method" value="email">

                <div class="mb-3">
                    <label class="form-label fw-semibold">아이디</label>
                    <input type="text" name="username" class="form-control"
                           th:value="${method != 'phone' ? username : ''}"
                           placeholder="아이디 입력" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">이름</label>
                    <input type="text" name="name" class="form-control"
                           th:value="${method != 'phone' ? name : ''}"
                           placeholder="가입 시 입력한 이름" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">이메일</label>
                    <input type="email" name="email" class="form-control"
                           th:value="${method != 'phone' ? email : ''}"
                           placeholder="가입 시 입력한 이메일" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-shield-check me-2"></i>본인 확인
                </button>
            </form>

            <!-- 휴대폰으로 찾기 폼 -->
            <form id="form-phone"
                  th:style="${method == 'phone'} ? '' : 'display:none;'"
                  th:action="@{/auth/find-password/verify}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="method" value="phone">

                <div class="mb-3">
                    <label class="form-label fw-semibold">아이디</label>
                    <input type="text" name="username" class="form-control"
                           th:value="${method == 'phone' ? username : ''}"
                           placeholder="아이디 입력" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">이름</label>
                    <input type="text" name="name" class="form-control"
                           th:value="${method == 'phone' ? name : ''}"
                           placeholder="가입 시 입력한 이름" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">휴대전화번호</label>
                    <input type="tel" name="phone" id="phoneInput" class="form-control phone-input"
                           th:value="${method == 'phone' ? phone : ''}"
                           placeholder="010-0000-0000"
                           inputmode="numeric" maxlength="13" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-shield-check me-2"></i>본인 확인
                </button>
            </form>

        </div>

        <hr class="my-4">
        <div class="d-flex justify-content-center gap-3 small">
            <a th:href="@{/auth/login}" class="text-muted text-decoration-none">
                <i class="bi bi-box-arrow-in-right me-1"></i>로그인
            </a>
            <span class="text-muted">|</span>
            <a th:href="@{/auth/find-id}" class="text-muted text-decoration-none">
                <i class="bi bi-person-check me-1"></i>아이디 찾기
            </a>
            <span class="text-muted">|</span>
            <a th:href="@{/auth/signup}" class="text-muted text-decoration-none">
                <i class="bi bi-person-plus me-1"></i>회원가입
            </a>
        </div>

    </div>
</div>

<script>
function switchTab(tab) {
    document.getElementById('form-email').style.display = tab === 'email' ? '' : 'none';
    document.getElementById('form-phone').style.display = tab === 'phone' ? '' : 'none';
    document.querySelectorAll('.nav-link').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'email') || (i === 1 && tab === 'phone'));
    });
}


/* 비밀번호 강도 */
const newPwInput = document.getElementById('newPwInput');
if (newPwInput) {
    newPwInput.addEventListener('input', function () {
        const pw = this.value;
        const fill = document.getElementById('pwFill');
        const msg  = document.getElementById('pwStrengthMsg');
        if (!pw) { fill.style.width = '0'; msg.textContent = ''; return; }

        let score = 0;
        if (/[a-z]/.test(pw)) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        if (pw.length >= 14) score++;

        const levels = [
            { w:'20%', bg:'#dc3545', text:'매우 약함', cls:'text-danger'  },
            { w:'40%', bg:'#fd7e14', text:'약함',      cls:'text-warning' },
            { w:'60%', bg:'#ffc107', text:'보통',      cls:'text-warning' },
            { w:'80%', bg:'#20c997', text:'강함',      cls:'text-success' },
            { w:'100%',bg:'#198754', text:'매우 강함', cls:'text-success' },
        ];
        const lv = levels[Math.min(score - 1, 4)] || levels[0];
        fill.style.width      = lv.w;
        fill.style.background = lv.bg;
        msg.textContent       = '강도: ' + lv.text;
        msg.className         = 'form-text ' + lv.cls;
    });

    /* 비밀번호 일치 확인 */
    document.getElementById('newPwConfirmInput').addEventListener('input', function () {
        const msg = document.getElementById('pwMatchMsg');
        if (!this.value) { msg.textContent = ''; return; }
        if (this.value === newPwInput.value) {
            msg.textContent = '✓ 비밀번호가 일치합니다.';
            msg.className   = 'form-text text-success';
        } else {
            msg.textContent = '✗ 비밀번호가 일치하지 않습니다.';
            msg.className   = 'form-text text-danger';
        }
    });

    /* 눈 아이콘 토글 */
    function bindToggle(btnId, inputId, iconId) {
        document.getElementById(btnId).addEventListener('click', function () {
            const inp  = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            inp.type   = inp.type === 'password' ? 'text' : 'password';
            icon.classList.toggle('bi-eye',       inp.type === 'password');
            icon.classList.toggle('bi-eye-slash', inp.type === 'text');
        });
    }
    bindToggle('togglePw1', 'newPwInput',        'eyeIcon1');
    bindToggle('togglePw2', 'newPwConfirmInput',  'eyeIcon2');
}
</script>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
