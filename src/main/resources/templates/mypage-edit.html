<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('내 정보 수정')}"></th:block>
    <style>
        .section-label {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #6c757d;
            margin-bottom: .5rem;
        }
        .pw-strength-bar {
            height: 4px;
            border-radius: 2px;
            background: #e9ecef;
            overflow: hidden;
            margin-top: 6px;
        }
        .pw-strength-fill {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: width .3s, background .3s;
        }
    </style>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">내 정보 수정</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white-50">홈</a></li>
                <li class="breadcrumb-item"><a th:href="@{/mypage}" class="text-white-50">마이페이지</a></li>
                <li class="breadcrumb-item active text-white">정보 수정</li>
            </ol>
        </nav>
    </div>
</div>

<section class="section-padding">
    <div class="container">
        <div class="row g-4">

            <!-- 사이드바 -->
            <th:block th:replace="~{layout/fragments :: mypageSidebar('edit')}"></th:block>

            <!-- 메인 컨텐츠 -->
            <div class="col-md-9">

                <!-- 현재 내 정보 (읽기 전용) -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold py-3">
                        <i class="bi bi-person-circle me-2 text-primary"></i>현재 내 정보
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <p class="section-label mb-1">아이디</p>
                                <p class="fw-semibold mb-0" th:text="${member.username}">-</p>
                            </div>
                            <div class="col-md-4">
                                <p class="section-label mb-1">이름</p>
                                <p class="fw-semibold mb-0" th:text="${member.name}">-</p>
                            </div>
                            <div class="col-md-4">
                                <p class="section-label mb-1">이메일</p>
                                <p class="fw-semibold mb-0" th:text="${member.email}">-</p>
                            </div>
                            <div class="col-md-4">
                                <p class="section-label mb-1">연락처</p>
                                <p class="fw-semibold mb-0"
                                   th:text="${member.phone != null and !#strings.isEmpty(member.phone) ? member.phone : '미등록'}">-</p>
                            </div>
                            <div class="col-md-8">
                                <p class="section-label mb-1">배송지 주소</p>
                                <p class="fw-semibold mb-0"
                                   th:if="${member.address != null and !#strings.isEmpty(member.address)}"
                                   th:text="${'(' + member.zipCode + ') ' + member.address + (member.addressDetail != null and !#strings.isEmpty(member.addressDetail) ? ' ' + member.addressDetail : '')}">-</p>
                                <p class="fw-semibold mb-0 text-muted"
                                   th:unless="${member.address != null and !#strings.isEmpty(member.address)}">미등록</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 수정 폼 -->
                <form th:action="@{/mypage/edit}" method="post"
                      th:object="${profileUpdateDto}" novalidate id="editForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- 오류 메시지 -->
                    <div th:if="${errorMsg}" class="alert alert-danger py-2 mb-4">
                        <i class="bi bi-exclamation-circle me-1"></i>
                        <span th:text="${errorMsg}"></span>
                    </div>

                    <!-- ① 연락처 카드 -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white fw-bold py-3">
                            <i class="bi bi-telephone me-2 text-primary"></i>휴대전화번호 변경
                        </div>
                        <div class="card-body p-4">
                            <div class="row g-3">
                                <div class="col-md-10">
                                    <label class="form-label fw-semibold">새 휴대전화번호</label>

                                    <!-- 전화번호 입력 + 발송 버튼 -->
                                    <div class="input-group mb-2">
                                        <input type="tel" th:field="*{phone}"
                                               class="form-control phone-input"
                                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                               id="editPhone"
                                               th:placeholder="${member.phone != null and !#strings.isEmpty(member.phone) ? member.phone : '010-0000-0000'}"
                                               inputmode="numeric" maxlength="13" autocomplete="tel">
                                        <button type="button" class="btn btn-outline-secondary" id="sendOtpBtn">
                                            인증번호 발송
                                        </button>
                                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                                    </div>

                                    <!-- OTP 입력란 (초기 hidden) -->
                                    <div id="otpSection" style="display:none;">
                                        <div class="input-group mb-1">
                                            <input type="text" class="form-control" id="otpInput"
                                                   placeholder="인증번호 6자리 입력"
                                                   maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                                            <span class="input-group-text fw-bold text-danger" id="otpTimer"
                                                  style="min-width:52px;justify-content:center;"></span>
                                            <button type="button" class="btn btn-outline-primary" id="confirmOtpBtn">인증 확인</button>
                                        </div>
                                        <div id="otpMsg" class="form-text"></div>
                                    </div>

                                    <!-- 인증 완료 -->
                                    <div id="phoneVerifiedMsg" class="form-text text-success fw-semibold" style="display:none;">
                                        <i class="bi bi-check-circle-fill me-1"></i>휴대전화 인증이 완료되었습니다.
                                    </div>
                                    <div class="form-text text-muted" id="phonePendingMsg">
                                        번호를 입력하고 인증번호 발송 버튼을 눌러주세요. 비워두면 변경되지 않습니다.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ② 배송지 카드 -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white fw-bold py-3">
                            <i class="bi bi-house-door me-2 text-primary"></i>배송지 주소 변경
                        </div>
                        <div class="card-body p-4">

                            <!-- 우편번호 -->
                            <div class="input-group mb-2" style="max-width:320px;">
                                <input type="text" th:field="*{zipCode}"
                                       class="form-control" id="editZipCode"
                                       placeholder="우편번호">
                                <button type="button" class="btn btn-outline-primary" id="addrSearchBtn">
                                    <i class="bi bi-search me-1"></i>주소 찾기
                                </button>
                            </div>

                            <!-- 기본 주소 -->
                            <input type="text" th:field="*{address}"
                                   class="form-control mb-2" id="editAddress"
                                   placeholder="주소 찾기 버튼을 눌러주세요">

                            <!-- 상세 주소 -->
                            <input type="text" th:field="*{addressDetail}"
                                   class="form-control" id="editAddressDetail"
                                   placeholder="상세 주소 입력 (동/호수 등)"
                                   autocomplete="off">
                            <div class="form-text text-muted mt-1">
                                <i class="bi bi-info-circle me-1"></i>
                                저장된 주소가 자동으로 입력됩니다. 변경 시 주소 찾기를 이용하세요.
                            </div>
                        </div>
                    </div>

                    <!-- 버튼 -->
                    <div class="d-flex gap-2 flex-wrap mb-3">
                        <a th:href="@{/mypage/change-password}" class="btn btn-outline-secondary">
                            <i class="bi bi-lock me-2"></i>비밀번호 변경하기
                        </a>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1 btn-lg" id="submitBtn">
                            <i class="bi bi-check-circle me-2"></i>수정 완료
                        </button>
                        <a th:href="@{/mypage}" class="btn btn-outline-secondary flex-grow-1 btn-lg">
                            <i class="bi bi-x-circle me-2"></i>취소
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>
</section>

<!-- 카카오 우편번호 API -->
<script th:inline="javascript">
    const csrfHeader = /*[[${_csrf.headerName}]]*/ '';
    const csrfToken  = /*[[${_csrf.token}]]*/ '';
let postcodeScriptPromise = null;

function ensurePostcodeLoaded() {
    if (window.daum && window.daum.Postcode) {
        return Promise.resolve();
    }
    if (postcodeScriptPromise) {
        return postcodeScriptPromise;
    }

    postcodeScriptPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
        script.async = true;
        script.onload = function () {
            if (window.daum && window.daum.Postcode) {
                resolve();
            } else {
                reject(new Error('postcode-api-missing'));
            }
        };
        script.onerror = function () {
            reject(new Error('postcode-api-load-failed'));
        };
        document.head.appendChild(script);
    });

    return postcodeScriptPromise;
}

/* ── 휴대전화 숫자만 + 변경 시 인증 초기화 ── */
let phoneVerified    = false;
let otpTimerInterval = null;

document.getElementById('editPhone').addEventListener('input', function () {
    if (phoneVerified) {
        phoneVerified = false;
        document.getElementById('phoneVerifiedMsg').style.display = 'none';
        document.getElementById('phonePendingMsg').style.display  = 'block';
        document.getElementById('otpSection').style.display       = 'none';
        clearInterval(otpTimerInterval);
    }
});

/* ── 인증번호 발송 ── */
document.getElementById('sendOtpBtn').addEventListener('click', async function () {
    const phone = document.getElementById('editPhone').value.replace(/-/g, '').trim();
    if (!/^01[0-9]{8,9}$/.test(phone)) {
        alert('올바른 휴대전화번호를 입력해주세요. (11자리 숫자, 예: 01012345678)');
        document.getElementById('editPhone').focus();
        return;
    }

    this.disabled    = true;
    this.textContent = '발송 중...';

    try {
        const res = await fetch('/api/verify/phone/send', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                [csrfHeader]: csrfToken
            },
            body: new URLSearchParams({ phone, type: 'PROFILE' })
        });
        const data = await res.json();

        if (data.success) {
            document.getElementById('otpSection').style.display       = 'block';
            document.getElementById('phoneVerifiedMsg').style.display  = 'none';
            document.getElementById('phonePendingMsg').style.display   = 'none';
            document.getElementById('otpMsg').textContent              = '';
            document.getElementById('otpInput').value                  = '';
            phoneVerified = false;
            startOtpTimer(180);
            document.getElementById('otpInput').focus();
            this.textContent = '재발송';
        } else {
            alert(data.message);
            this.textContent = '인증번호 발송';
        }
    } catch (err) {
        alert('인증번호 발송에 실패했습니다. 잠시 후 다시 시도해주세요.');
        this.textContent = '인증번호 발송';
    } finally {
        this.disabled = false;
    }
});

/* ── 인증번호 확인 ── */
document.getElementById('confirmOtpBtn').addEventListener('click', async function () {
    const phone = document.getElementById('editPhone').value.replace(/-/g, '').trim();
    const otp   = document.getElementById('otpInput').value.trim();
    const msg   = document.getElementById('otpMsg');

    if (otp.length !== 6) {
        msg.textContent = '인증번호 6자리를 입력해주세요.';
        msg.className   = 'form-text text-danger';
        return;
    }

    try {
        const res = await fetch('/api/verify/phone/confirm', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                [csrfHeader]: csrfToken
            },
            body: new URLSearchParams({ phone, otp, type: 'PROFILE' })
        });
        const data = await res.json();

        if (data.success) {
            phoneVerified = true;
            clearInterval(otpTimerInterval);
            document.getElementById('otpSection').style.display       = 'none';
            document.getElementById('phoneVerifiedMsg').style.display  = 'block';
            document.getElementById('phonePendingMsg').style.display   = 'none';
            msg.textContent = '';
        } else {
            msg.textContent = '✗ ' + data.message;
            msg.className   = 'form-text text-danger';
        }
    } catch (err) {
        msg.textContent = '인증 확인 중 오류가 발생했습니다.';
        msg.className   = 'form-text text-danger';
    }
});

/* Enter 키 → 인증 확인 */
document.getElementById('otpInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('confirmOtpBtn').click(); }
});

/* 타이머 */
function startOtpTimer(seconds) {
    clearInterval(otpTimerInterval);
    const timerEl = document.getElementById('otpTimer');
    let remaining = seconds;

    function tick() {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        timerEl.textContent = m + ':' + String(s).padStart(2, '0');
        if (remaining <= 0) {
            clearInterval(otpTimerInterval);
            timerEl.textContent = '만료';
            const msg = document.getElementById('otpMsg');
            msg.textContent = '인증번호가 만료되었습니다. 재발송을 눌러주세요.';
            msg.className   = 'form-text text-danger';
        }
        remaining--;
    }
    tick();
    otpTimerInterval = setInterval(tick, 1000);
}

/* ── 제출 전 전화번호 인증 확인 ── */
document.getElementById('editForm').addEventListener('submit', function (e) {
    const phone = document.getElementById('editPhone').value.trim();
    if (phone && !phoneVerified) {
        e.preventDefault();
        alert('휴대전화 본인인증을 완료해주세요.');
        document.getElementById('editPhone').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }
});

/* ── 카카오 우편번호 ── */
document.getElementById('addrSearchBtn').addEventListener('click', async function () {
    try {
        await ensurePostcodeLoaded();
    } catch (error) {
        postcodeScriptPromise = null;
        alert('주소 검색 서비스를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
        return;
    }
    new daum.Postcode({
        oncomplete: function (data) {
            document.getElementById('editZipCode').value       = data.zonecode;
            document.getElementById('editAddress').value       = data.address;
            document.getElementById('editAddressDetail').value = '';
            document.getElementById('editAddressDetail').focus();
        }
    }).open();
});

</script>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
