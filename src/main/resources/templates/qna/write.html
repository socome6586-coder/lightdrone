<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragments :: head('Q&amp;A 질문 작성')}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs5.min.css" rel="stylesheet">
    <style>
        /* 질문 작성 — 네모·세련·컴팩트 */
        .qna-write-card { border-radius: 6px; }
        .qna-write-card .card-header {
            background: #fff; padding: 14px 18px;
            border-bottom: 1px solid #eef0f3; font-weight: 700;
        }
        .qna-write-card .card-body { padding: 22px 24px; }
        .qna-write-card .form-control,
        .qna-write-card .form-select { border-radius: 4px; }
        .qna-write-card .form-label { font-size: .88rem; margin-bottom: .35rem; }
        .qna-write-card .btn { border-radius: 4px; }
        .qna-form-btn { width: 150px; padding: .55rem 0; font-weight: 600; }
        .qna-img-thumb {
            position: relative; width: 76px; height: 76px; border-radius: 6px;
            overflow: hidden; border: 1px solid #e5e8ec; flex-shrink: 0;
        }
        .qna-img-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* 모바일 최적화 */
        @media (max-width: 767px) {
            .qna-write-card .card-body { padding: 16px; }
            /* 카테고리 셀렉트는 손가락 탭 편하게 전체 폭 */
            .qna-write-card select.form-select { max-width: 100% !important; }
            /* 등록/취소 버튼을 가로 절반씩 채워 누르기 쉽게 */
            .qna-write-card .qna-form-btn { flex: 1; width: auto; padding: .65rem 0; }
        }
    </style>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<section class="content-page">
    <div class="container">
        <h4 class="content-section-title">질문 작성</h4>
        <div class="row g-4">

            <!-- 사이드바 -->
            <th:block th:replace="~{layout/fragments :: mypageSidebar('qna')}"></th:block>

            <!-- 작성 폼 -->
            <div class="col-md-9 mypage-content">
                <div class="content-card qna-write-card">
                    <div class="card-header">
                        <i class="bi bi-pencil-square me-2 text-primary"></i>질문 작성
                    </div>
                    <div class="card-body">

                        <form th:action="@{/qna/write}" th:object="${qnaDto}"
                              method="post" enctype="multipart/form-data" autocomplete="off" novalidate>

                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger py-2 small mb-3">
                                <ul class="mb-0 ps-3">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                                </ul>
                            </div>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- 세부 카테고리 -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">카테고리</label>
                                <select class="form-select" th:field="*{category}" style="max-width:200px;">
                                    <option th:each="cat : ${qnaCategories}"
                                            th:value="${cat}" th:text="${cat}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control"
                                       th:field="*{title}"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                       placeholder="제목을 입력해 주세요." autocomplete="off" maxlength="200">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                                     th:errors="*{title}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">내용 <span class="text-danger">*</span></label>
                                <textarea class="form-control"
                                          th:field="*{content}"
                                          th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                                          rows="10" placeholder="문의 내용을 입력하세요"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}"
                                     th:errors="*{content}"></div>
                            </div>

                            <!-- 이미지 첨부 (여러 장) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    이미지 첨부
                                    <span class="text-muted fw-normal small ms-1">(jpg, png, gif, webp / 여러 장 선택 가능)</span>
                                </label>
                                <input type="file" name="imageFiles" id="imageFiles" class="form-control" multiple
                                       accept="image/jpeg,image/png,image/gif,image/webp">
                                <div class="form-text text-muted">한 장당 최대 10MB</div>
                                <div id="imgPreview" class="d-flex flex-wrap gap-2 mt-2"></div>
                            </div>

                            <!-- 비공개 여부 -->
                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="secretToggle"
                                           th:field="*{secret}" onchange="togglePassword(this)">
                                    <label class="form-check-label fw-semibold" for="secretToggle">
                                        <i class="bi bi-lock-fill me-1 text-secondary"></i>비공개 글 (비밀번호 설정)
                                    </label>
                                </div>
                                <div class="form-text text-muted">
                                    체크 시 비밀번호를 아는 본인과 관리자만 열람할 수 있습니다.
                                </div>
                            </div>

                            <!-- 비밀번호 (비공개 시에만 표시) -->
                            <div class="mb-4" id="passwordSection">
                                <label class="form-label fw-semibold">
                                    열람 비밀번호 <span class="text-danger">*</span>
                                    <span class="text-muted fw-normal small ms-1">(숫자 4자리)</span>
                                </label>
                                <input type="password" class="form-control" id="passwordInput" style="max-width:160px;"
                                       th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                       placeholder="0000" maxlength="4" inputmode="numeric"
                                       autocomplete="new-password"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                     th:errors="*{password}"></div>
                                <div class="form-text text-muted">
                                    게시글 열람 시 이 비밀번호가 필요합니다. 잘 기억해 두세요.
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary qna-form-btn">등록하기</button>
                                <a th:href="@{/qna}" class="btn btn-outline-secondary qna-form-btn">취소</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/lang/summernote-ko-KR.min.js"></script>
<script>
$(function () {
    $('#content').summernote({
        lang: 'ko-KR',
        dialogsInBody: true,
        height: 300,
        placeholder: '문의 내용을 입력하세요',
        toolbar: [
            ['font',     ['bold','italic','underline','strikethrough','clear']],
            ['fontname', ['fontname']],
            ['fontsize', ['fontsize']],
            ['color',    ['color']],
            ['para',     ['ul','ol','paragraph']],
            ['insert',   ['picture']],
            ['view',     ['undo','redo','fullscreen']],
        ],
        fontNames: ['Noto Sans KR','Arial','Arial Black','Courier New','Helvetica','Times New Roman'],
        fontSizes: ['10','11','12','13','14','16','18','20','24','28','36'],
        callbacks: {
            onImageUpload: function (files) {
                uploadEditorImage(files, $(this));
            }
        }
    });

    /* Bootstrap 5 동적 드롭다운 수동 토글 */
    $(document).on('click', '.note-toolbar .dropdown-toggle', function () {
        const $parent = $(this).closest('.note-btn-group, .btn-group');
        const $menu   = $parent.find('> .dropdown-menu, > .note-dropdown-menu').first();
        if (!$menu.length) return;
        const willOpen = !$menu.hasClass('show');
        $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        if (willOpen) $menu.addClass('show');
    });
    $(document).on('click', function (e) {
        if (!$(e.target).closest('.note-toolbar .note-btn-group, .note-toolbar .btn-group').length) {
            $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        }
    });

    $('form').on('submit', function () {
        $('#content').val($('#content').summernote('code'));
    });

    /* 다중 이미지 미리보기 */
    $('#imageFiles').on('change', function () {
        const box = document.getElementById('imgPreview');
        box.innerHTML = '';
        Array.from(this.files).forEach(function (file) {
            if (!file.type.startsWith('image/')) return;
            const div = document.createElement('div');
            div.className = 'qna-img-thumb';
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            div.appendChild(img);
            box.appendChild(div);
        });
    });
});

/* Summernote 에디터 내 이미지 업로드 → 서버 저장 후 URL 삽입 */
function uploadEditorImage(files, $editor) {
    Array.from(files).forEach(function (file) {
        if (!file.type.startsWith('image/')) return;
        var fd = new FormData();
        fd.append('file', file);
        $.ajax({
            url: '/api/upload-image',
            method: 'POST',
            data: fd,
            contentType: false,
            processData: false,
            success: function (res) {
                if (res && res.url) {
                    $editor.summernote('insertImage', res.url);
                } else {
                    alert('이미지 업로드에 실패했습니다.');
                }
            },
            error: function () {
                alert('이미지 업로드에 실패했습니다. (로그인 상태와 파일 형식을 확인하세요)');
            }
        });
    });
}

function togglePassword(checkbox) {
    var section = document.getElementById('passwordSection');
    var input   = document.getElementById('passwordInput');
    if (checkbox.checked) {
        section.style.display = '';
        input.required = true;
    } else {
        section.style.display = 'none';
        input.required = false;
        input.value = '';
    }
}
// 페이지 로드 시 초기 상태 적용
document.addEventListener('DOMContentLoaded', function () {
    var cb = document.getElementById('secretToggle');
    if (cb) togglePassword(cb);
});
</script>
</body>
</html>
