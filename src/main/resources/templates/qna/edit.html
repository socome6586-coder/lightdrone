<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/fragments :: head('QnA 수정')}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs5.min.css" rel="stylesheet">
    <style>
        /* 모바일 최적화 */
        @media (max-width: 767px) {
            .card-body.p-4 { padding: 16px !important; }
            /* 수정완료/취소 버튼 가로 절반씩 */
            .card-body > form > .d-flex.gap-2 .btn { flex: 1; }
        }
    </style>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">Q&amp;A 수정</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white-50">홈</a></li>
                <li class="breadcrumb-item"><a th:href="@{/qna}" class="text-white-50">Q&amp;A</a></li>
                <li class="breadcrumb-item active text-white">수정</li>
            </ol>
        </nav>
    </div>
</div>

<section class="section-padding">
    <div class="container">
        <div class="row g-4">

            <th:block th:replace="~{layout/fragments :: mypageSidebar('qna')}"></th:block>

            <div class="col-md-9">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <span class="fw-bold">
                            <i class="bi bi-pencil me-2 text-primary"></i>게시글 수정
                        </span>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="@{/qna/{id}/edit(id=${qna.id})}" th:object="${qnaUpdateDto}"
                              method="post" enctype="multipart/form-data" novalidate>

                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger py-2 small mb-3">
                                <ul class="mb-0 ps-3">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                                </ul>
                            </div>

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control"
                                       th:field="*{title}"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                       maxlength="200">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                                     th:errors="*{title}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">내용 <span class="text-danger">*</span></label>
                                <textarea class="form-control"
                                          th:field="*{content}"
                                          th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                                          rows="10"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}"
                                     th:errors="*{content}"></div>
                            </div>

                            <!-- 이미지 첨부 -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    이미지 첨부
                                    <span class="text-muted fw-normal small ms-1">(여러 장 선택 가능 / 선택한 이미지는 기존에 추가됩니다)</span>
                                </label>
                                <div th:if="${!#lists.isEmpty(qna.allImageUrls)}" class="mb-2 d-flex flex-wrap gap-2">
                                    <img th:each="img : ${qna.allImageUrls}" th:src="${img}" alt="현재 이미지"
                                         class="img-thumbnail" style="max-height:120px;">
                                </div>
                                <input type="file" name="imageFiles" class="form-control" multiple
                                       accept="image/jpeg,image/png,image/gif,image/webp">
                                <div class="form-text text-muted">최대 10MB / 여러 장 선택 가능</div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>수정 완료
                                </button>
                                <a th:href="@{/qna/{id}(id=${qna.id})}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg me-1"></i>취소
                                </a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/lang/summernote-ko-KR.min.js"></script>
<script>
$(function () {
    $('#content').summernote({
        lang: 'ko-KR',
        dialogsInBody: true,
        height: 300,
        placeholder: '문의 내용을 입력하세요',
        toolbar: [
            ['font',     ['bold','italic','underline','strikethrough','clear']],
            ['fontname', ['fontname']],
            ['fontsize', ['fontsize']],
            ['color',    ['color']],
            ['para',     ['ul','ol','paragraph']],
            ['view',     ['undo','redo','fullscreen']],
        ],
        fontNames: ['Noto Sans KR','Arial','Arial Black','Courier New','Helvetica','Times New Roman'],
        fontSizes: ['10','11','12','13','14','16','18','20','24','28','36'],
    });

    /* Bootstrap 5 동적 드롭다운 수동 토글 */
    $(document).on('click', '.note-toolbar .dropdown-toggle', function () {
        const $parent = $(this).closest('.note-btn-group, .btn-group');
        const $menu   = $parent.find('> .dropdown-menu, > .note-dropdown-menu').first();
        if (!$menu.length) return;
        const willOpen = !$menu.hasClass('show');
        $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        if (willOpen) $menu.addClass('show');
    });
    $(document).on('click', function (e) {
        if (!$(e.target).closest('.note-toolbar .note-btn-group, .note-toolbar .btn-group').length) {
            $('.note-toolbar .dropdown-menu, .note-toolbar .note-dropdown-menu').removeClass('show');
        }
    });

    $('form').on('submit', function () {
        $('#content').val($('#content').summernote('code'));
    });
});
</script>
</body>
</html>
