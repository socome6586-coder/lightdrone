<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/fragments :: head('QnA 상세')}"></th:block>
    <style>
        .qna-category-label {
            display: inline-block;
            margin-bottom: .35rem;
            color: #165dcc;
            font-size: .78rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .qna-status-text {
            color: #7b8492;
            font-size: .78rem;
            font-weight: 500;
            white-space: nowrap;
        }
        .qna-status-text.done { color: #167647; }
        .qna-admin-actions {
            border: 1px solid #e4e8ee !important;
            border-radius: 3px !important;
            box-shadow: none !important;
        }
        .qna-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 32px;
            padding: .32rem .75rem;
            border-radius: 3px !important;
            font-size: .8rem;
            font-weight: 600;
            line-height: 1.2;
            box-shadow: none !important;
        }
        .qna-action-btn:hover { transform: none; }
        @media (max-width: 767px) {
            /* 카드 안쪽 여백 축소 (좁은 화면에서 본문 폭 확보) */
            .card-body.p-4 { padding: 1.1rem !important; }
            /* 탭 영역 키우기 */
            .qna-action-btn { min-height: 40px; }
            /* 하단 버튼 세로 정렬: 목록으로 한 줄, 수정/작성 한 줄(반반) */
            .qna-bottom-actions { flex-direction: column; align-items: stretch !important; gap: .5rem; }
            .qna-bottom-actions > a.qna-action-btn { width: 100%; }
            .qna-bottom-actions > div { width: 100%; }
            .qna-bottom-actions > div .qna-action-btn { flex: 1; }
        }
    </style>
</head>
<body>
<th:block th:replace="~{layout/fragments :: navbar}"></th:block>

<div class="page-header">
    <div class="page-header-overlay"></div>
    <div class="container text-center text-white position-relative">
        <h1 class="display-5 fw-bold">Q&amp;A 게시판</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-white-50">홈</a></li>
                <li class="breadcrumb-item"><a th:href="@{/qna}" class="text-white-50">Q&amp;A</a></li>
                <li class="breadcrumb-item active text-white">상세</li>
            </ol>
        </nav>
    </div>
</div>

<section class="section-padding">
    <div class="container">

                <!-- 성공 메시지 -->
                <div th:if="${successMsg}" class="alert alert-success mb-3">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${successMsg}"></span>
                </div>

                <!-- 비밀번호 입력 폼 (비공개 + 잠금 상태) -->
                <div th:if="${!unlocked and qna.secret}" class="card border-0 shadow-sm">
                    <div class="card-body text-center py-5">
                        <i class="bi bi-lock-fill text-secondary" style="font-size:3rem;"></i>
                        <h5 class="fw-bold mt-3 mb-1">비밀번호 보호 게시글</h5>
                        <p class="text-muted small mb-4">이 게시글을 열람하려면 작성 시 설정한 비밀번호를 입력하세요.</p>

                        <div th:if="${errorMsg}" class="alert alert-danger py-2 small mb-3 text-start mx-auto" style="max-width:360px;">
                            <i class="bi bi-exclamation-circle me-1"></i>
                            <span th:text="${errorMsg}"></span>
                        </div>

                        <form th:action="@{/qna/{id}/verify(id=${qna.id})}" method="post"
                              class="d-flex flex-column align-items-center gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="input-group" style="max-width:280px;">
                                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                <input type="password" name="password" class="form-control text-center"
                                       placeholder="비밀번호 4자리" maxlength="4" inputmode="numeric"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                                       autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-unlock me-1"></i>확인
                            </button>
                        </form>

                        <div class="mt-4">
                            <a th:href="@{/qna}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-left me-1"></i>목록으로
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 게시글 내용 (잠금 해제 상태) -->
                <div th:if="${unlocked}">

                    <!-- 질문 카드 -->
                    <div class="card border-0 shadow-sm mb-3">
                        <div class="card-header bg-white py-3">
                            <div class="d-flex justify-content-between align-items-start gap-2">
                                <div>
                                    <span th:if="${qna.category != null}"
                                          class="qna-category-label" th:text="|[${qna.category}]|">[카테고리]</span>
                                    <h5 class="fw-bold mb-0" th:text="${qna.title}">제목</h5>
                                </div>
                                <div class="flex-shrink-0 pt-1">
                                    <span th:if="${qna.answered}" class="qna-status-text done">답변이 완료되었습니다.</span>
                                    <span th:unless="${qna.answered}" class="qna-status-text">답변 대기중입니다.</span>
                                </div>
                            </div>
                            <div class="d-flex gap-3 mt-2 text-muted small">
                                <span>
                                    <i class="bi bi-person me-1"></i>
                                    <span th:text="${qna.member != null ? qna.member.name : '알 수 없음'}">작성자</span>
                                </span>
                                <span>
                                    <i class="bi bi-clock me-1"></i>
                                    <span th:text="${#temporals.format(qna.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</span>
                                </span>
                                <span>
                                    <i class="bi bi-eye me-1"></i>
                                    <span th:text="${qna.viewCount}">0</span>
                                </span>
                            </div>
                        </div>
                        <div class="card-body p-4">
                            <!-- 첨부 이미지 (여러 장) -->
                            <div th:if="${!#lists.isEmpty(qna.allImageUrls)}" class="mb-4 text-center">
                                <img th:each="img : ${qna.allImageUrls}" th:src="${img}" alt="첨부 이미지"
                                     class="img-fluid rounded shadow-sm mb-3 d-block mx-auto"
                                     style="max-width:100%;max-height:500px;">
                            </div>
                            <div style="word-break:break-word; line-height:1.8;"
                                 th:utext="${qna.content}"></div>
                        </div>
                    </div>

                    <!-- 답변 카드 -->
                    <div th:if="${qna.answered}" class="card border-0 shadow-sm border-start border-4 border-primary mb-3">
                        <div class="card-header bg-primary bg-opacity-10 py-3">
                            <span class="fw-bold text-primary">
                                <i class="bi bi-chat-dots-fill me-2"></i>관리자 답변
                            </span>
                        </div>
                        <div class="card-body p-4">
                            <div style="line-height:1.8;"
                                 th:utext="${qna.answer}"></div>
                        </div>
                    </div>

                    <!-- 관리자 답변 관리 버튼 -->
                    <div th:if="${isAdmin}" class="card qna-admin-actions mb-3">
                        <div class="card-body py-3 d-flex align-items-center justify-content-between">
                            <span class="text-muted small">
                                <i class="bi bi-shield-fill me-1 text-secondary"></i>관리자 전용 답변 편집기
                            </span>
                            <a th:href="@{/admin/qna/{id}(id=${qna.id})}" class="btn btn-primary qna-action-btn">
                                <span th:text="${qna.answered} ? '답변 수정' : '답변 작성'"></span>
                            </a>
                        </div>
                    </div>

                    <!-- 하단 버튼 -->
                    <div class="d-flex justify-content-between align-items-center qna-bottom-actions">
                        <a th:href="@{/qna}" class="btn btn-outline-secondary qna-action-btn">
                            목록으로
                        </a>
                        <div class="d-flex gap-2">
                            <!-- 작성자 본인 + 미답변 시 수정 버튼 -->
                            <a th:if="${canEdit}" th:href="@{/qna/{id}/edit(id=${qna.id})}"
                               class="btn btn-outline-primary qna-action-btn">
                                수정하기
                            </a>
                            <a th:if="${member != null}" th:href="@{/qna/write}" class="btn btn-primary qna-action-btn">
                                질문 작성
                            </a>
                        </div>
                    </div>

                </div>

    </div>
</section>

<th:block th:replace="~{layout/fragments :: footer}"></th:block>
</body>
</html>
